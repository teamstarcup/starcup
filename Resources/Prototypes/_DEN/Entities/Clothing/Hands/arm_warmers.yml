- type: entity
  parent: [ ClothingHandsButcherable, TemperatureProtectionMinimal ] # starcup - keep those arms warm
  id: ClothingHandsArmWarmersFingerless
  name: fingerless arm-warmers
  description: A set of long, fingerless arm-warmers made from comfortable knit fabric. They'll keep your arms warm, alright, but your digits are out of luck. # starcup - reworded second sentence
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Hands/ArmWarmers/plain.rsi # starcup - moved to Hands
  - type: Clothing
    sprite: _DEN/Clothing/Hands/ArmWarmers/plain.rsi # starcup - moved to Hands
  - type: Fiber
    fiberMaterial: fibers-synthetic
    fiberColor: fibers-white
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 0 # no protection

