# "# Fashion Update" denotes unsorted Den ports taken from Aurora/World Server/Nuclear 14

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatFeatheredCap
  name: feathered cap
  description: A green cap, with a smooth, white feather placed within the rim. It makes you want to shoot a bow.
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Head/Hats/featheredcap.rsi
  - type: Clothing
    sprite: _DEN/Clothing/Head/Hats/featheredcap.rsi
    clothingVisuals: # starcup - move up a bit to cover hair
      head:
      - state: equipped-HELMET
        offset: "0, 0.025"

- type: entity # Fashion Update - Aurora Station
  parent: ClothingHeadBase
  id: ClothingHeadHatBeretArtist
  name: artist beret
  description: A beret fit for an artist. # TODO - we can do better
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Head/Hats/beret_artist.rsi # starcup - moved namespace, TODO - colored versions
  - type: Clothing
    sprite: _DEN/Clothing/Head/Hats/beret_artist.rsi # starcup - moved namespace, TODO - colored versions
    clothingVisuals: # starcup - move up a bit to cover hair
      head:
      - state: equipped-HELMET
        offset: "0, 0.025"
  - type: Tag
    tags:
    - ClothMade

