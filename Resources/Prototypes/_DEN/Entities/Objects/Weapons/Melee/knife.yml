- type: entity
  parent: BaseKnife
  id: BaseKnifeSpinnable # Don't use this for items that actually do something mechanical when you press Z, and you have to make the animated sprites yourself
  abstract: true
  components:
  - type: Sprite
    state: icon
  - type: ItemToggle # You can toggle spinning it around your finger, though it's just cosmetic
    verbToggleOn: item-toggle-spin
    verbToggleOff: item-toggle-catch
    predictable: false
#    soundActivate:
#      path: /Audio/Effects/toss.ogg # Spin
#      params:
#        pitch: 1.1 # I'm using 1.1 for normal knives, 0.9 for large knives, and 1.3 for tiny knives
#        variation: 0.05
#    soundDeactivate:
#      path: /Audio/Effects/weak_hit2.ogg # Catch
#      params:
#        volume: -9
#        pitch: 1.1 # Same as above
#        variation: 0.05
  - type: UseDelay
    delay: 0.5 # This is just under one spin animation, presuming it has 8 frames that are 0.07 delay each, so you can spam Z to spin it exactly one time
  - type: Appearance
  - type: ToggleableVisuals
    spriteLayer: null # Spinning it only changes the inhand sprites
#    replaceMode: true # The original inhand sprites won't remain visible when toggled # starcup - not a thing anymore
    inhandVisuals:
      left:
      - state: spinning-inhand-left
      right:
      - state: spinning-inhand-right

- type: entity
  parent: BaseKnifeSpinnable # starcup - reparenting to the old prebase version for spins!
  id: TailorsKnife
  name: tailor's knife
  description: A simple, wedge-shaped knife designed to cut fabric. The hole in the handle is just big enough to spin it around your finger. # starcup - spinnable!
  components:
  - type: Tag
    tags:
    - Knife
  - type: MeleeWeapon # You'd be better off punching them
    attackRate: 1
    damage:
      types:
        Slash: 3 # starcup - 1->3 (utility knife does 4)
# begin starcup - let you throw the stupid knife
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 2
  - type: LandAtCursor
# end starcup
  - type: DisarmMalus
    malus: 0.225
  - type: ThrowingAngle
    angle: 180
  - type: Sprite
    sprite: _DEN/Objects/Weapons/Melee/tailorsknife.rsi
    state: icon
  - type: Item
    sprite: _DEN/Objects/Weapons/Melee/tailorsknife.rsi
