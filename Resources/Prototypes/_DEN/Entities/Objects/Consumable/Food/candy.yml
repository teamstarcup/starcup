- type: entity
  parent: [ SolutionVeryTiny, FoodSnackBase ] # starcup - added SolutionVeryTiny
  id: FoodSnackGummyBear
  name: gummy bear
  description: Good luck getting three bites out of this.
  components:
  - type: Sprite
    sprite: _DEN/Objects/Consumable/Food/Candy/gummy_bear.rsi
    layers:
    - state: green
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - FoodSnack
    - Candy
  - type: Solution # starcup - remove SolutionContainerManager
    solution:
#      maxVol: 5
      reagents:
      - ReagentId: Nutriment
        Quantity: 2
      - ReagentId: Sugar
        Quantity: 3
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        blue: ""
        green: ""
        orange: ""
        pink: ""
        purple: ""
        red: ""
        yellow: ""

- type: entity
  parent: [ SolutionNormal, FoodSnackBase ] # starcup - SolutionNormal
  id: FoodSnackGummyWormLarge
  name: giant gummy worm
  description: You're not gonna eat the WHOLE thing, are you?
  components:
  - type: Sprite
    sprite: _DEN/Objects/Consumable/Food/Candy/large_gummy_worm.rsi
    state: worm
  - type: Item
    size: Normal
  - type: Solution # starcup - remove SolutionContainerManager
    solution:
#      maxVol: 20 # starcup - contains half of SolutionNormal, as standard for food
      reagents:
      - ReagentId: Nutriment
        Quantity: 30 # starcup - x1.5
      - ReagentId: Sugar
        Quantity: 30 # starcup - x1.5

## Larj bar

- type: entity
  parent: BaseItem
  id: FoodSnackChocolateBarLarjWrapped
  name: Larj bar
  description: A massive chocolate bar, Larj enough to split with your friends.
  components:
  - type: Sprite
    sprite: _DEN/Objects/Consumable/Food/Candy/larj_bar.rsi
    state: wrapped
  - type: Item
    size: Normal
  - type: SpawnItemsOnUse
    items:
    - id: FoodSnackChocolateBarLarjUnwrapped
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  parent: [ SolutionNormal, FoodSnackBase, BaseSlicingRefinableFood ] # starcup - SlicableFood breaking change, SolutionNormal
  id: FoodSnackChocolateBarLarjUnwrapped
  name: Larj bar
  description: A massive chocolate bar, Larj enough to split with your friends.
  components:
  - type: Sprite
    sprite: _DEN/Objects/Consumable/Food/Candy/larj_bar.rsi
    state: unwrapped
  - type: Item
    size: Normal
  - type: Solution # starcup - remove SolutionContainerManager
    solution:
#      maxVol: 30 # starcup - contains about 72u, or a bit over half of SolutionNormal
      reagents:
      - ReagentId: Nutriment
        Quantity: 27 # starcup - 9 -> 27
      - ReagentId: Sugar
        Quantity: 18 # starcup - 6 -> 18
      - ReagentId: Theobromine
        Quantity: 18 # starcup - 6 -> 18
      - ReagentId: CocoaPowder
        Quantity: 9 # starcup - 3 -> 9
  - type: ToolRefinable
    refineResult:
    - id: FoodSnackChocolateBarLarjChunk
      amount: 3

- type: entity
  parent: [ FoodSnackBase, BaseSlicingRefinableFood ] # starcup - SlicableFood breaking change
  id: FoodSnackChocolateBarLarjChunk
  name: Larj bar chunk
  description: One third of a Larj bar, bringing it to a more reasonable size.
  components:
  - type: Sprite
    sprite: _DEN/Objects/Consumable/Food/Candy/larj_bar.rsi
    state: chunk
  - type: Item
    size: Small
  - type: Solution # starcup - remove SolutionContainerManager
    solution:
#      maxVol: 10 # starcup - contains 20u
      reagents:
      - ReagentId: Nutriment
        Quantity: 9 # starcup - x3
      - ReagentId: Sugar
        Quantity: 6 # starcup - x3
      - ReagentId: Theobromine
        Quantity: 6 # starcup - x3
      - ReagentId: CocoaPowder
        Quantity: 3 # starcup - x3
  - type: ToolRefinable
    refineResult:
    - id: FoodSnackChocolateBarLarjPiece
      amount: 4

- type: entity
  parent: [ SolutionVeryTiny, FoodSnackBase ] # starcup - added SolutionVeryTiny
  id: FoodSnackChocolateBarLarjPiece
  name: Larj bar piece
  description: A tiny piece off of a colossal Larj bar.
  components:
  - type: Sprite
    sprite: _DEN/Objects/Consumable/Food/Candy/larj_bar.rsi
    state: chunk_small
  - type: Item
    size: Tiny
  - type: Solution # starcup - remove SolutionContainerManager
    solution:
#      maxVol: 3 # starcup - contains 2.5, proportionate to above values
      reagents:
      - ReagentId: Nutriment
        Quantity: 2.25 # starcup - x3
      - ReagentId: Sugar
        Quantity: 1.5 # starcup - x3
      - ReagentId: Theobromine
        Quantity: 1.5 # starcup - x3
      - ReagentId: CocoaPowder
        Quantity: 0.75 # starcup - x3

