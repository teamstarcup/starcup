# Candy buckets! These can hold any snack food item, and they inherit
# from a WizDen prototype (which apparently already existed?)

# Original bucket's sprites,for reference:
# - type: Sprite
#   sprite: Objects/Fun/candy_bucket.rsi
#   layers:
#   - state: empty_icon
#     map: ["enum.ToggleableVisuals.Layer"]
# - type: GenericVisualizer
#   visuals:
#     enum.ToggleableVisuals.Enabled:
#       enum.ToggleableVisuals.Layer:
#         True: {state: full_icon}
#         False: {state: empty_icon}

# starcup - removed the candybuckets' reliance on ContainerHeld for now (it's buggy) and remapped sprites to our namespace
# just to make it easier to revert this later!

- type: entity
  parent: CandyBucket
  id: CandyBucketPailCat
  suffix: cat pail
  components:
  - type: Sprite
    sprite: _starcup/Objects/Fun/Candybucket/cat.rsi # starcup

- type: entity
  parent: CandyBucket
  id: CandyBucketPailClown
  suffix: clown pail
  components:
  - type: Sprite
    sprite: _starcup/Objects/Fun/Candybucket/clown.rsi # starcup

- type: entity
  parent: CandyBucket
  id: CandyBucketPailGhost
  suffix: ghost pail, glow-in-the-dark
  components:
  - type: Sprite
    sprite: _starcup/Objects/Fun/Candybucket/ghost.rsi # starcup
    layers:
# begin starcup
#    - state: empty_icon
#      map: ["enum.ToggleableVisuals.Layer"]
    - state: icon-0
      map: [ "enum.StorageFillLayers.Fill" ]
# end starcup
    - state: overlay # Little bit of glow
      shader: unshaded

- type: entity
  parent: CandyBucket
  id: CandyBucketPailPumpkin
  suffix: pumpkin pail
  components:
  - type: Sprite
    sprite: _starcup/Objects/Fun/Candybucket/pumpkin.rsi # starcup

- type: entity
  parent: CandyBucket
  id: CandyBucketPailSkeleton
  suffix: skeleton pail
  components:
  - type: Sprite
    sprite: _starcup/Objects/Fun/Candybucket/skeleton.rsi # starcup

