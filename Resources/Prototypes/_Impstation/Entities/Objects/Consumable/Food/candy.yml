- type: entity
  name: conversation heart
  parent: FoodMealBase
  id: FoodConversationHeart
  description: "You can barely make out the imprinted text: luv u"
  components:
  - type: Tag
    tags:
    - FoodSnack
    - Candy # starcup
  - type: FlavorProfile
    flavors:
    - chalky
  - type: Item
    size: Tiny
    shape: # starcup - 1x2 feels too big!
    - 0,0,0,0
  - type: Sprite
    sprite: _Impstation/Objects/Consumable/Food/candy.rsi
    layers:
    - state: chalkheartcolorable
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        chalkheartcolorable: Pastel
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 1
        reagents:
        - ReagentId: Sugar
          Quantity: 1
  - type: RandomMetadata
    descriptionSegments: [ConversationHeartDescriptions]

- type: entity
  name: box of conversation hearts
  parent: BoxCardboard
  id: BoxConversationHeart
  description: A little container full of chalky treats to give to your honey. Or eat all on your own like some kind of weirdo.
  components:
# begin starcup - update containerfill format
#  - type: StorageFill
#    contents:
#    - id: FoodConversationHeart
#      amount: 5
#    - id: FoodSnackGummyWormLarge
#      prob: 0.01
#      orGroup: SometimesWorm
#    - id: FoodConversationHeart
#      orGroup: SometimesWorm
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: FoodConversationHeart
          amount: 5
# end starcup
  - type: Storage
    grid:
    - 0,0,2,1
    maxItemSize: Tiny
  - type: Sprite
    sprite: _Impstation/Objects/Consumable/Food/candy.rsi
    state: chalkheartpackage2

- type: entity
  name: chocolate heart
  parent: FoodMealBase
  id: FoodChocolateHeart
  description: A mass-produced chocolate heart. How sweet.
  components:
  - type: Tag
    tags:
    - FoodSnack
    - Candy # starcup
  - type: Item
    size: Tiny
    shape: # starcup - 1x2 feels too big!
    - 0,0,0,0
  - type: Sprite
    sprite: _Impstation/Objects/Consumable/Food/candy.rsi
    layers:
    - state: chocolateheart
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Sugar
          Quantity: 2
        - ReagentId: CocoaPowder
          Quantity: 2
        - ReagentId: Theobromine
          Quantity: 1

- type: entity
  name: chocolate heart
  suffix: dark
  parent: FoodChocolateHeart
  id: FoodChocolateHeartDark
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Consumable/Food/candy.rsi
    layers:
    - state: chocolateheartdark

- type: entity
  name: chocolate heart
  suffix: white
  parent: FoodChocolateHeartImitation # starcup - white chocolate does not contain theobromine! :D
  description: A mass-produced white chocolate heart. How sweet. # starcup - gave distinct description
  id: FoodChocolateHeartWhite
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Consumable/Food/candy.rsi
    layers:
    - state: chocolateheartwhite

- type: entity
  name: heart-shaped box
  parent: BoxCardboard
  id: BoxChocolateHearts
  description: A box of romantic treats, brought to you by your friends at GetMore Chocolate Corp!
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Consumable/Food/candy.rsi
    layers:
    - map: [ base ]
      state: heartbox-closed
# begin starcup - add imitation choc/update containerfill format
#  - type: StorageFill
#    contents:
#    - id: FoodChocolateHeart
#      amount: 2
#    - id: FoodChocolateHeartDark
#      amount: 2
#    - id: FoodChocolateHeartWhite
#      amount: 2
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: FoodChocolateHeart
          amount: 2
        - id: FoodChocolateHeartImitation
          amount: 2
        - !type:GroupSelector
          rolls: 2
          children:
          - id: FoodChocolateHeartDark
          - id: FoodChocolateHeartWhite
# end starcup
  - type: Storage
    grid:
    - 0,0,2,1
    maxItemSize: Tiny
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: heartbox-open }
          False: { state: heartbox-closed }
  - type: Appearance

- type: entity
  name: homemade chocolate heart
  parent: FoodChocolateHeart
  id: FoodHomemadeChocolateHeart
  description: A chocolate heart, made with love and a microwave.
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Consumable/Food/candy.rsi
    layers:
    - state: homemadechocolate
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15 # extra space for poison purposes
        reagents:
        - ReagentId: Sugar
          Quantity: 2
        - ReagentId: CocoaPowder
          Quantity: 2
        - ReagentId: Theobromine
          Quantity: 1

- type: entity
  name: berry macaron
  parent: FoodMealBase
