- type: entity
  parent: BasePlushie
  id: PlushieUrsaMinor
  name: ursa minor plushie
  description: You get the feeling that this plushie is higher ranked than you.
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Fun/toys.rsi
    state: minor
  - type: FlavorProfile
    flavors:
    - stardust
  - type: FoodSequenceElement
    entries:
      CottonBurger: UrsaMinorPlushie

- type: entity
  parent: BasePlushie
  id: PlushieGiantBear
  name: ursa massive plushie
  description: If I have to carry this for one second longer I might die.
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Fun/toys.rsi
    state: giantbearplush
  - type: Item
    size: Large
    sprite: _Impstation/Objects/Fun/toys.rsi
    inhandVisuals:
      left:
      - state: giantbearplush-inhand
      right:
      - state: giantbearplush-inhand
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Animals/bear.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Animals/bear.ogg
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
  - type: HeldSpeedModifier
    walkModifier: 0.5
    sprintModifier: 0.5
  - type: DamageOtherOnHit # if you get hit by this you deserve it
    damage:
      types:
        Blunt: 0 # DEN
    soundHit: /Audio/Animals/bear.ogg
#    staminaCost: 50 # starcup
  - type: StaminaDamageOnHit # DEN
    damage: 5
  - type: MultiHandedItem

- type: entity
  parent: BasePlushie
  id: PlushieDoll
  name: sentimental ragdoll
  description: A cute little ragdoll! Aw, it even has buttons for eyes...
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Fun/toys.rsi
    state: doll_base
  - type: Item
    inhandVisuals:
      left:
      - state: doll_base-inhand-left
      right:
      - state: doll_base-inhand-right
  - type: FoodSequenceElement
    entries:
      CottonBurger: DollPlushie

- type: entity
  parent: BasePlushie
  id: PlushieDollHair
  name: sentimental doll
  description: Make sure to brush its hair and tuck it into bed every night.
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Fun/toys.rsi
    state: doll_hair
  - type: Item
    inhandVisuals:
      left:
      - state: doll_hair-inhand-left
      right:
      - state: doll_hair-inhand-right
  - type: FoodSequenceElement
    entries:
      CottonBurger: HairDollPlushie

- type: entity
  parent: FoamCutlass
  id: DevilPitchfork
  name: devil's pitchfork
  description: Perfect for prodding and poking sinners!
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Fun/devilpitchfork.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.5
    range: 2.0
    damage:
      types:
        Blunt: 0
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: Item
    inhandVisuals:
      left:
        - state: inhand-left
      right:
        - state: inhand-right

- type: entity
  id: ItemBouquet
  parent: BaseItem
  name: bouquet
  description: The Augarvian flower language equivalent of a keysmash. # starcup - fancifulifized description
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Fun/bouquet.rsi
    state: bouquet
  - type: Item
    size: Normal
    sprite: _Impstation/Objects/Fun/bouquet.rsi
    inhandVisuals:
      left:
      - state: bouquet-inhand-left
      right:
      - state: bouquet-inhand-right
  - type: Construction
    graph: Bouquet
    node: bouquet
