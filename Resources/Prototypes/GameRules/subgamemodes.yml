- type: entity
  parent: BaseGameRule
  id: Thief
  components:
  - type: ThiefRule
  - type: AntagObjectives
    objectives:
    - EscapeThiefShuttleObjective
  - type: AntagRandomObjectives
    sets:
    - groups: ThiefBigObjectiveGroups
      prob: 0.7
      maxPicks: 1
    - groups: ThiefObjectiveGroups
      maxPicks: 10
    maxDifficulty: 2.5
  - type: AntagSelection
    agentName: thief-round-end-agent-name
    selectionTime: PrePlayerSpawn
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Thief
      playerRatio: 10 # starcup: decreased from 20 since thieves are their own gamemode
      range:
        min: 1
        max: 8 # starcup: increased from 3 since thieves are their own gamemode
  - type: DynamicRuleCost
    cost: 75
  - type: GameRule
    cancelPresetOnTooFewPlayers: false
  # begin starcup: added delay for standalone gamemode
    delay:
      min: 240
      max: 420
  # end starcup

# Needs testing
