- type: entity
  parent: VendingMachine
  id: VendingMachineCourierDrobe
  name: CourierDrobe
  description: Neither solar flares nor meteors nor plasma fire nor void of space stays these couriers from the swift completion of their appointed rounds.
  suffix: Logistics Vendor # starcup
  components:
  - type: VendingMachine
    pack: CourierDrobeInventory
  - type: VendingMachineVisuals
    offState: off
    brokenState: broken
    normalState: normal-unshaded
  - type: DatasetVocalizer
    dataset: CourierDrobeAds
  - type: SpeakOnUIClosed
    pack: CourierDrobeGoodbyes
  - type: Sprite
    sprite: _DV/Structures/Machines/VendingMachines/courierdrobe.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: AccessReader
    access: [["Mail"]]

- type: entity
  parent: VendingMachine
  id: VendingMachineMNKDrobe
  name: MNK Drobe
  description: Quality garments provided by MoNoKrome.
  suffix: Fashion Vendor # starcup
  components:
  - type: VendingMachine
    pack: MNKDrobeInventory
  - type: VendingMachineVisuals
    offState: off
    brokenState: broken
    normalState: off # starcup
  - type: Sprite
    sprite: _DV/Structures/Machines/VendingMachines/mnkdrobe.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off" # starcup - empty placeholder to avoid errors
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
