- type: entity
  parent: BasePlushie
  id: PlushieDragon
  name: dragon plushie
  description: An adorable stuffed toy that resembles a dragon.
  components:
  - type: Sprite
    sprite: _Floof/Objects/Fun/floof_plush.rsi
    state: dragon
    color: "#ff0000"
  - type: PhysicalComposition
    materialComposition:
      Plastic: 100
  - type: StaticPrice
    price: 75
  - type: UseDelay
    delay: 3.0
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Animals/space_dragon_roar.ogg
      params:
        volume: -8 # starcup - reduced from 1
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Animals/space_dragon_roar.ogg
      params:
        volume: -8 # starcup - reduced from 1
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/Animals/space_dragon_roar.ogg
      params:
        volume: -8 # starcup - reduced from 1
  - type: EmitSoundOnCollide
    sound:
      collection: ToyFall
      params:
        variation: 0.03
        volume: 3
# begin starcup - unnecessary, base plushie handles this fine
#  - type: MeleeWeapon
#    soundHit:
#      collection: ToyFall
#      params:
#        variation: 0.05
#        volume: 4
# end starcup
  - type: FoodSequenceElement
    entries:
      CottonBurger: DragonPlushie
