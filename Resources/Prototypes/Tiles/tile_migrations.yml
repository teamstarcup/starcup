# Classic: Special case!!!!
# Respritening turned FloorTechMaint into FloorTechMaint2 and the maps are now baked with that
# and the data is lost. I choose to restore it to FloorTechMaint because it looks closest to
# what was originally used in most maps.
# For downstreams: Remove this migration if you have old pre-Respritening map files and want to 
# keep the original tiles.
