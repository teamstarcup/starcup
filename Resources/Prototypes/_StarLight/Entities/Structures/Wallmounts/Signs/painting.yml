- type: entity
  parent: PaintingBase
  id: PaintingRedTide
  name: Red Tide
  description: A vivid painting depicting a crimson wave crashing against dark rocks.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Wallmounts/paintings.rsi
    state: Red_Tide_Painting
  # begin starcup: unhangable posters
  - type: DisassembleOnAltVerb
    prototypeToSpawn: PaintingCurtainedRedTide
  # end starcup

- type: entity
  parent: PaintingBase
  id: PaintingHammer
  name: Fiery Hammer # starcup: changed from Soviet Hammer
  description: A bold painting of a hammer, symbolizing strength and unity.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Wallmounts/paintings.rsi
    state: Hammer_Painting
  # begin starcup: unhangable posters
  - type: DisassembleOnAltVerb
    prototypeToSpawn: PaintingCurtainedHammer
  # end starcup
