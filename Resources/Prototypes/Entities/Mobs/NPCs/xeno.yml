# Hacky for the stress test so don't even consider adding to this

- type: entity
  name: base exomorph # starcup - splitting burrower off
  id: MobXeno
  abstract: true # starcup
  parent: SimpleSpaceMobBase
  description: They mostly come at night. Mostly.
  components:
  - type: Insulated
  - type: CombatMode
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: XenoCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 1.5
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
  - type: NpcFactionMember
    factions:
    - Xeno
  - type: Hands
  - type: ItemOffer # starcup - item offering
  - type: ComplexInteraction
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/Xenos/burrower.rsi
    layers:
  # begin starcup: add sleeping, change sprites to RMC14 versions
    - map: ["enum.DamageStateVisualLayers.Base", "sleeping" ]
      state: alive
  # end starcup
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 1000
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  # begin starcup exomorph buffs
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      130: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      #25: 0.5
      60: 0.8
      80: 0.5
  # end starcup
  - type: Stamina
    baseCritThreshold: 200
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: FluorosulfuricAcid
        Quantity: 650
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit:
      collection: AlienClawSnarl # starcup
    animation: WeaponArcClaw
    damage:
      types:
        Piercing: 8 # starcup: was 6
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive # starcup
      Critical:
        Base: crit
      Dead:
        Base: dead
  - type: Puller
    needsHands: true
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatXeno
      amount: 5
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghost-role-information-xeno-name
    description: ghost-role-information-xeno-description
    rules: ghost-role-information-xeno-rules
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: TypingIndicator
    proto: alien
  - type: Temperature
    currentTemperature: 310.15
  - type: TemperatureDamage
    heatDamageThreshold: 360
    coldDamageThreshold: -150
  - type: Tag
    tags:
      - CannotSuicide
      - DoorBumpOpener
      - FootstepSound
      - FootstepSound
      - CreatureEmotes # starcup
  - type: NoSlip
  - type: Perishable #Ummmm the acid kills a lot of the bacteria or something
    molsPerSecondPerUnitMass: 0.0005
  # begin starcup: exomorph reworks
  - type: Speech
    speechVerb: Xeno
    speechSounds: XenoSpeechSounds
    allowedEmotes: [ "TailWhip", "Drool", "CreatureHiss", "CreatureGrowl", "CreatureRoar", "CreatureScream" ]
  - type: Vocal
    sounds:
      Unsexed: XenoEmotes
    screamId: CreatureScream
    screamAction: ActionEmitSound
  - type: ReplacementAccent
    accent: xeno
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepBird # look, it's a clawed foot. it works.
  - type: IgnoreSpiderWeb
  - type: Rest
    restAction: RestActionXeno
    sleepingLayers:
      sleeping:
        state: sleeping
    awakeLayers:
      sleeping:
        state: alive
  - type: HealOnSleep
    damage:
      types:
        Poison: -0.2
        Heat: -0.3
        Cold: -0.3
        Blunt: -0.35
        Piercing: -0.35
        Slash: -0.35
  - type: Damageable
    damageModifierSet: Exomorph
  - type: Deathgasp
    needsCritical: false
  # end starcup

- type: entity
  name: praetorian
  parent: MobXeno
  id: MobXenoPraetorian
  description: Exomorph brute. Swift and powerful guardian of the lair. # starcup
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Mobs/OldXenonids/Praetorian/praetorian.rsi # starcup
    #offset: 0,0.4
  - type: MobThresholds
    thresholds:
      0: Alive
  # begin starcup
      250: Critical
      280: Dead
  - type: Stamina
    baseCritThreshold: 200
  - type: MovementSpeedModifier
    baseSprintSpeed: 5 # big fast scary dude
  - type: SlowOnDamage
    speedModifierThresholds:
      #50: 0.7
      200: 0.8 # praetorians are tanks, not easily slowed down
      240: 0.5
  # end starcup
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 400
        mask:
        - MobMask
        layer:
        - MobLayer
  # begin starcup: exomorph reworks
  - type: Vocal
    sounds:
      Unsexed: XenoLargeEmotes
  - type: Rest
    awakeLayers:
      sleeping:
        state: alive
  - type: MeleeWeapon
    angle: 20
  - type: Prying
    speedModifier: 2
    useSound:
      path: /Audio/Items/crowbar.ogg
  # end starcup

- type: entity
  name: drone
  parent: MobXeno
  id: MobXenoDrone
  description: Exomorph laborer. Stocky and resistant. # starcup: exomorph reworks
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Mobs/OldXenonids/Drone/drone.rsi # starcup
    #offset: 0,0.2
  - type: MobThresholds
    thresholds:
      0: Alive
  # begin starcup
      160: Critical
      190: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      #40: 0.7
      90: 0.8
  - type: MeleeWeapon
    attackRate: 0.75
    soundHit:
      collection: MetalThud
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 6
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Critical:
        Base: crit
      Dead:
        Base: dead
  - type: Spider
    webAction: ActionXenoWeeds
    webPrototype: XenoWeeds
  - type: Hunger
    thresholds:
      Overfed: 100
      Okay: 50
      Peckish: 25
      Starving: 10
      Dead: 0
    baseDecayRate: 0.00925925925926
  - type: SpawnWallAbility
    productionLength: 12
    entityProduced: WallXenoResin
    hungerCost: 12
    minHungerThreshold: Starving
    soundProgress:
      path: /Audio/_starcup/Effects/resin_secretion.ogg
    soundFinished:
      collection: AlienBuild
  # end starcup
  - type: MovementSpeedModifier
    baseSprintSpeed: 3 # starcup: drones are tough but lumbering
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 450
        mask:
        - MobMask
        layer:
        - MobLayer

