- type: entity
  name: rouny
  parent: MobXeno
  id: MobXenoRouny
  description: Curious exomorph strain. Not very imposing. # starcup
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/Xenos/rouny.rsi
    # begin starcup: rouny's still using the upstream rsi, so state is "running" rather than "alive"
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "sleeping" ]
      state: running
    # end starcup
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatRouny
      amount: 3
  - type: Speech
    speechVerb: Xeno
    speechSounds: XenoRounySpeechSounds
    allowedEmotes: [ "TailWhip", "Drool", "CreatureHiss", "CreatureGrowl", "CreatureRoar", "CreatureScream" ]
  - type: Vocal
    sounds:
      Male: XenoRounyEmotes
      Female: XenoRounyEmotes
      Unsexed: XenoRounyEmotes
  - type: JumpAbility
    action: ActionXenoPounce
    canCollide: true
    jumpDistance: 3
    jumpSound:
      path: /Audio/_starcup/Weapons/Xeno/rounypounce.ogg
  - type: ReplacementAccent
    accent: RounyAccent
  # begin starcup: rouny's still using the upstream rsi, so state is "running" rather than "alive"
  - type: DamageStateVisuals
    states:
      Alive:
        Base: running
      Critical:
        Base: crit
      Dead:
        Base: dead
  - type: Rest
    restAction: RestActionXeno
    sleepingLayers:
      sleeping:
        state: sleeping
    awakeLayers:
      sleeping:
        state: running
  - type: MeleeWeapon # weaker strain
    damage:
      types:
        Piercing: 5
    animation: WeaponArcBite
  # end starcup

