# Hacky for the stress test so don't even consider adding to this

- type: entity
  name: base exomorph # starcup - splitting burrower off
  id: MobXeno
  abstract: true # starcup
  parent: SimpleSpaceMobBase
  description: They mostly come at night. Mostly.
  components:
  - type: Insulated
  - type: CombatMode
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: XenoCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 1.5
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
  - type: NpcFactionMember
    factions:
    - Xeno
  - type: Hands
  - type: ItemOffer # starcup - item offering
  - type: ComplexInteraction
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/Xenos/burrower.rsi
    layers:
  # begin starcup: add sleeping, change sprites to RMC14 versions
    - map: ["enum.DamageStateVisualLayers.Base", "sleeping" ]
      state: alive
  # end starcup
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 1000
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  # begin starcup
  - type: MobStateActions
    actions:
      Critical:
      - ActionCritSuccumb
      - ActionCritFakeDeath
      - ActionCritLastWords
  # end starcup
  - type: MobThresholds
    thresholds:
      0: Alive
      70: Dead # starcup - exomorph buff
  - type: SlowOnDamage
    speedModifierThresholds:
      25: 0.5
  - type: Stamina
    baseCritThreshold: 200
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: FluorosulfuricAcid
        Quantity: 650
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit:
      collection: AlienClaw
    animation: WeaponArcBite
    damage:
      groups:
        Brute: 6
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive # starcup
      Critical:
        Base: crit
      Dead:
        Base: dead
  - type: Puller
    needsHands: true
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatXeno
      amount: 5
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghost-role-information-xeno-name
    description: ghost-role-information-xeno-description
    rules: ghost-role-information-xeno-rules
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: TypingIndicator
    proto: alien
  - type: Temperature
    currentTemperature: 310.15
  - type: TemperatureDamage
    heatDamageThreshold: 360
    coldDamageThreshold: -150
  - type: Tag
    tags:
      - CannotSuicide
      - DoorBumpOpener
      - FootstepSound
      - CreatureEmotes # starcup
  - type: NoSlip
  - type: Perishable #Ummmm the acid kills a lot of the bacteria or something
    molsPerSecondPerUnitMass: 0.0005
  # begin starcup: exomorph reworks
  - type: Speech
    speechVerb: Xeno
    speechSounds: Xeno
    allowedEmotes: [ "Tailwhip", "Drool", "CreatureHiss", "CreatureGrowl", "CreatureRoar", "CreatureScream" ]
  - type: Vocal
    sounds:
      Male: Xeno
      Female: Xeno
      Unsexed: Xeno
  - type: IgnoreSpiderWeb
  # end starcup

  # begin starcup: exomorph reworks
- type: entity
  id: MobXenoRest
  abstract: true
  description: They mostly come at night. Mostly.
  components:
  - type: Rest
    restAction: RestActionXeno
    sleepingLayers:
      sleeping:
        state: sleeping
    awakeLayers:
      sleeping:
        state: alive
  - type: HealOnSleep
    damage:
      groups:
        Brute: -0.3
        Burn: -0.1
  # end starcup

- type: entity
  name: praetorian
  parent:
  # begin starcup
  - MobXeno
  - MobXenoRest
  # end starcup
  id: MobXenoPraetorian
  description: Exomorph brute. Swift and powerful guardian of the lair. # starcup
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Mobs/OldXenonids/Praetorian/praetorian.rsi # starcup
    offset: 0,0.4
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead # starcup
  - type: Stamina
    critThreshold: 300
  - type: MovementSpeedModifier # starcup
    baseSprintSpeed: 5 # starcup - big fast scary dude
  - type: SlowOnDamage
    speedModifierThresholds:
      50: 0.7
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 400
        mask:
        - MobMask
        layer:
        - MobLayer
  # begin starcup: exomorph reworks
  - type: Speech
    speechVerb: Xeno
    speechSounds: XenoLarge
    allowedEmotes: [ "Tailwhip", "Drool", "CreatureHiss", "CreatureGrowl", "CreatureRoar", "CreatureScream" ]
  - type: Rest
    awakeLayers:
      sleeping:
        state: alive
  # end starcup

- type: entity
  name: drone
  parent:
  # begin starcup
  - MobXeno
  - MobXenoRest
  # end starcup
  id: MobXenoDrone
  description: Exomorph laborer. Stocky and resistant. # starcup: exomorph reworks
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Mobs/OldXenonids/Drone/drone.rsi # starcup
    offset: 0,0.2
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead # starcup
  - type: SlowOnDamage
    speedModifierThresholds:
# begin starcup
      40: 0.7
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    animation: WeaponArcPunch # headbutter
    damage:
      types:
        Blunt: 6
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Critical:
        Base: crit
      Dead:
        Base: dead
  - type: Spider
    webAction: ActionXenoWeeds
    webPrototype: XenoWeeds
  - type: BuildXenoWall
  # end starcup
  - type: MovementSpeedModifier
    baseSprintSpeed: 4
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 450
        mask:
        - MobMask
        layer:
        - MobLayer

- type: entity
  name: queen
  parent:
  # begin starcup
  - MobXeno
  - MobXenoRest
  # end starcup
  id: MobXenoQueen
  description: The deadly ruler of the exomorph colony. Long may she reign. # starcup
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Mobs/OldXenonids/Queen/queen.rsi # starcup
    offset: 0,0.4
  - type: MobThresholds
    thresholds:
      0: Alive
      450: Dead # starcup: the queen is a boss monster
  - type: SlowOnDamage
    speedModifierThresholds:
      150: 0.7
  - type: MeleeWeapon
    damage:
     groups:
       Brute: 12
  - type: MovementSpeedModifier
    baseSprintSpeed: 5 # starcup: Queen should be hard to outrun
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 15500
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Tag
    tags:
    - CannotSuicide
  # begin starcup: exomorph reworks
  - type: Speech
    speechVerb: Xeno
    speechSounds: XenoLarge
    allowedEmotes: [ "Tailwhip", "Drool", "CreatureHiss", "CreatureGrowl", "CreatureRoar", "CreatureScream" ]
  - type: FootstepModifier
    footstepSoundCollection:
      collection: AlienFootstepLarge
  # end starcup

- type: entity
  name: ravager
  parent:
  # begin starcup
  - MobXeno
  - MobXenoRest
  # end starcup
  id: MobXenoRavager
  description: Ferocious exomorph striker. Hacks their enemies apart. # starcup
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Mobs/OldXenonids/Ravager/ravager.rsi
    offset: 0,0.5
  - type: MobThresholds
    thresholds:
      0: Alive
      130: Dead # starcup
  - type: MovementSpeedModifier
    baseSprintSpeed: 4
  - type: MeleeWeapon
    animation: WeaponArcSlash
    attackRate: 1.5 # starcup: they are remarkably ferocious
    damage:
     types:
       Slash: 6 # starcup: small damage nerf to offset the faster attack rate
  - type: SlowOnDamage
    speedModifierThresholds:
      50: 0.7
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 1350
        mask:
        - MobMask
        layer:
        - MobLayer
  # begin starcup: give exomorphs a voice
  - type: Speech
    speechVerb: Xeno
    speechSounds: XenoLarge
    allowedEmotes: [ "Tailwhip", "Drool", "CreatureHiss", "CreatureGrowl", "CreatureRoar", "CreatureScream" ]
  # end starcup

- type: entity
  name: runner
  parent:
  # begin starcup
  - MobXeno
  - MobXenoRest
  # end starcup
  id: MobXenoRunner
  description: Fast exomorph skirmisher. Can quickly catch up to and pounce prey. # starcup
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Mobs/OldXenonids/Runner/runner.rsi # starcup
    offset: 0,0.6
  - type: MovementSpeedModifier
    baseSprintSpeed: 6.0
  - type: MeleeWeapon
    damage:
     groups:
       Brute: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 235
        mask:
        - MobMask
        layer:
        - MobLayer

- type: entity
  name: rouny
  parent:
  # begin starcup
  - MobXeno
  - MobXenoRest
  # end starcup
  id: MobXenoRouny
  description: Curious exomorph strain. Not very imposing. # starcup
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/Xenos/rouny.rsi
    # begin starcup: rouny's still using the upstream rsi, so state is "running" rather than "alive"
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "sleeping" ]
      state: running
    # end starcup
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatRouny
      amount: 3
  - type: Speech
    speechVerb: Xeno
    speechSounds: XenoRouny
    allowedEmotes: [ "Tailwhip", "Drool", "CreatureHiss", "CreatureGrowl", "CreatureRoar", "CreatureScream" ]
  - type: Vocal
    sounds:
      Male: XenoRouny
      Female: XenoRouny
      Unsexed: XenoRouny
  - type: JumpAbility
    action: ActionXenoPounce
    canCollide: true
    jumpDistance: 3
    jumpSound:
      collection: AlienPounce
  # begin starcup: rouny's still using the upstream rsi, so state is "running" rather than "alive"
  - type: DamageStateVisuals
    states:
      Alive:
        Base: running
      Critical:
        Base: crit
      Dead:
        Base: dead
  - type: Rest
    restAction: RestActionXeno
    sleepingLayers:
      sleeping:
        state: sleeping
    awakeLayers:
      sleeping:
        state: running
  # end starcup

- type: entity
  name: spitter
  parent:
  # begin starcup
  - MobXeno
  - MobXenoRest
  # end starcup
  id: MobXenoSpitter
  description: Ranged exomorph soldier. Spits acid from a distance. # starcup
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Mobs/OldXenonids/Spitter/spitter.rsi
    offset: 0,0.3
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead # starcup: exomorph reworks
  - type: MovementSpeedModifier
    baseSprintSpeed: 3 # starcup: making them slower to offset ranged attack
  - type: SlowOnDamage
    speedModifierThresholds:
      25: 0.7
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.75
  - type: BasicEntityAmmoProvider
    proto: AcidSpittle # starcup: exomorph reworks
    capacity: 1
    count: 1
  - type: Gun
    fireRate: 0.75
    useKey: false
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot: /Audio/Weapons/Xeno/alien_spitacid.ogg
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 235
        mask:
        - MobMask
        layer:
        - MobLayer

- type: entity
  name: space adder
  parent: SimpleSpaceMobBase
  id: MobPurpleSnake
  description: A menacing purple snake from Kepler-283c.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/Xenos/purple_snake.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: purple_snake
  - type: DamageStateVisuals
    states:
      Alive:
        Base: purple_snake
      Critical:
        Base: dead_purple_snake
      Dead:
        Base: dead_purple_snake
  - type: Butcherable
    spawned:
    - id: FoodMeatSnake
      amount: 4
  - type: Grammar
    attributes:
      proper: true
      gender: male
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
    - Xeno
    - SimpleHostile
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 5
  - type: SolutionContainerManager
    solutions:
      melee:
        reagents:
        - ReagentId: Toxin
          Quantity: 50
  - type: MeleeChemicalInjector
    solution: melee
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 25
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSnake
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
    - CreatureEmotes # starcup
    # begin starcup
  - type: Speech
    speechSounds: SpaceSnakeSpeechSounds
    speechVerb: Reptilian
    allowedEmotes: ['CreatureHiss']
  - type: Vocal
    sounds:
      Unsexed: SpaceSnakeSpeechEmotes
    screamId: CreatureHiss
    screamAction: ActionEmitSound
  - type: TypingIndicator
    proto: alien
  - type: ReplacementAccent
    accent: xeno
    # end starcup

- type: entity
  name: space adder
  parent: MobPurpleSnake
  id: MobSmallPurpleSnake
  suffix: small
  description: A smaller version of the menacing purple snake from Kepler-283c.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/Xenos/purple_snake.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: small_purple_snake
  - type: DamageStateVisuals
    states:
      Alive:
        Base: small_purple_snake
      Critical:
        Base: dead_small_purple_snake
      Dead:
        Base: dead_small_purple_snake
  - type: Butcherable
    spawned:
    - id: FoodMeatSnake
      amount: 2
  - type: SolutionTransfer
    maxTransferAmount: 1

