- type: entity
  parent: [ BaseWallmountGlass, StructureHealthFurnitureWeak ]
  id: Mirror
  name: mirror
  description: 'Mirror mirror on the wall , who''s the most robust of them all?'
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/mirror.rsi
    state: mirror
  - type: MagicMirror
    organs:
    - Head
    layers:
    - Hair
    - FacialHair
    changeHairSound: null
    modifyTime: 0
  - type: ActivatableUI
    key: enum.MagicMirrorUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.MagicMirrorUiKey.Key:
        type: MagicMirrorBoundUserInterface
  - type: Damageable
    damageModifierSet: GlassMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  # begin starcup
  - type: DisassembleOnAltVerb
    verbText: "disassemble-system-verb-pull-down"
    disassembleTime: 3
    soundFinished:
      path: /Audio/_starcup/Items/WoodenFrames/pull-down.ogg
      params:
        variation: 0.125
    prototypeToSpawn: MirrorRoundCarried
  # end starcup

- type: entity
  parent: Mirror
  id: MirrorModern
  suffix: rectangle
  components:
  - type: Sprite
    state: rectangle-mirror
  # begin starcup
  - type: DisassembleOnAltVerb
    prototypeToSpawn: MirrorModernCarried
  # end starcup
