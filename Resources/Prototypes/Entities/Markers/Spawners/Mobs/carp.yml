- type: entity
  parent: MarkerBase
  id: SpawnMobCarp
  name: Space Carp Spawner
  components:
  - type: Sprite
    layers:
    - state: green
    - state: icon
      sprite: Mobs/Aliens/Carps/space.rsi
  - type: ConditionalSpawner
    prototypes:
    - MobCarp
    - MobCarpSplitfin # expanded carp & sharkminnows
    - MobCarpVampire # expanded carp & sharkminnows
    - MobCarpQueen # expanded carp & sharkminnows

