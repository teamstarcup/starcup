- type: entity
  abstract: true
  parent: BaseItem
  id: BaseCrowbar
  name: crowbar
  description: A multipurpose tool used for many tasks, such as prying doors or bludgeoning interdimensional invaders.
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/crowbar_drop.ogg
  - type: Tag
    tags:
    - Crowbar
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.75 # starcup
    damage:
      types:
        Blunt: 8
    soundHit:
      collection: MetalClang # starcup: add tools & tool tweaks
  - type: Tool
    qualities:
      - Prying
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: ToolTileCompatible
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: StaticPrice
    price: 22
  - type: Prying
  - type: Sprite
    sprite: Objects/Tools/crowbar.rsi
  - type: Clothing
    sprite: Objects/Tools/crowbar.rsi
    quickEquip: false
    slots:
    - Belt
  - type: Item
    sprite: Objects/Tools/crowbar.rsi
    size: Small
  # begin starcup
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 2
  # end starcup

# Standard (grey) Crowbar
- type: entity
  parent: BaseCrowbar
  id: Crowbar
  components:
  - type: Sprite
    state: icon
  - type: Item
    storedSprite:
      sprite: Objects/Tools/crowbar.rsi
      state: storage

