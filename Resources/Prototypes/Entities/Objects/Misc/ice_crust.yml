- type: entity
  id: IceCrust
  name: ice crust
  description: It's cold and slippery.
  placement:
    mode: SnapgridCenter
    snap:
      - Wall
  components:
    - type: MeleeSound
      soundGroups:
        Brute:
          collection: GlassBreak
    # begin starcup
    - type: Sprite
      sprite: _starcup/Objects/Misc/ice_crust.rsi
      layers:
        - state: ice1
          map: [ "base" ]
          #map: ["enum.FoamVisualLayers.Base"]
        - map: [ "enum.EdgeLayer.South" ]
          state: double_edge_S
        - map: [ "enum.EdgeLayer.East" ]
          state: double_edge_E
        - map: [ "enum.EdgeLayer.North" ]
          state: double_edge_N
        - map: [ "enum.EdgeLayer.West" ]
          state: double_edge_W
      drawdepth: FloorObjects
    - type: SmoothEdge
    - type: IconSmooth
      mode: NoSprite
      key: ice
    - type: RandomSprite
      available:
      - base:
          ice1: ""
          ice2: ""
          ice3: ""
          ice4: ""
    - type: Appearance
    - type: DamageVisuals
      thresholds: [2, 5, 7]
      damageDivisor: 1
      trackAllDamage: true
      damageOverlay:
        sprite: _starcup/Objects/Misc/ice_crust_cracks.rsi
    # end starcup
    - type: Clickable
    - type: Transform
      anchored: true
    - type: Tag
      tags:
      - Ice
    - type: Physics
    - type: Fixtures
      fixtures:
        fix1:
          hard: false
          density: 7
          shape:
            !type:PhysShapeAabb
            bounds: "-0.4,-0.4,0.4,0.4"
          layer:
          - MidImpassable
    - type: Damageable
      damageModifierSet: Wood
    - type: Injurable
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 10
        behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - type: Temperature
      temperature: 250
      heatCapacity: 13440.002
    - type: TemperatureDamage
      heatDamage:
        types:
          Heat: 5
      coldDamage: {}
      heatDamageThreshold: 273.15
      coldDamageThreshold: 0
    - type: FrictionContacts
    - type: TileFrictionModifier
      modifier: 0.05
