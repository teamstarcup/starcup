# This action is pointed to in the "emoteAction:" field of the Vocal component to replace the default scream.

- type: entity
  parent: BaseAction
  id: ActionEmitSound
  name: Vocalize
  description: Emit a characteristic sound.
  components:
  - type: Action
    useDelay: 10
    checkCanInteract: false
  - type: Sprite
    sprite: _starcup/Interface/Actions/actions_general.rsi
    layers:
    - state: emit_sound
  - type: InstantAction
    event: !type:EmoteActionEvent
      emote: Scream
