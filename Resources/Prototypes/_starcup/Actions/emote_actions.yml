# These actione are pointed to in the "emoteAction:" field of the Vocal component to replace the default scream.

- type: entity
  parent: ActionScream
  id: ActionCreatureScream
  description: Make a characteristic sound.
  components:
  - type: Sprite
    sprite: _starcup/Interface/Actions/actions_general.rsi
    layers:
    - state: emit_sound
  - type: InstantAction
    event: !type:EmoteActionEvent
      emote: CreatureScream

