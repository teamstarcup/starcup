# Nest building
- type: entity
  parent: BaseAction
  id: ActionXenoWeeds
  name: Plant weeds
  description: Expand the hive and slow assailants down.
  components:
  - type: Action
    icon: { sprite: _RMC14/Actions/xeno_actions.rsi, state: plant_weeds }
    useDelay: 30
    sound: !type:SoundCollectionSpecifier
      collection: AlienDrool
  - type: InstantAction
    event: !type:SpiderWebActionEvent

- type: entity
  parent: BaseAction
  id: ActionXenoWeedsRoyal
  name: Plant weeds
  description: Expand the hive and slow assailants down.
  components:
  - type: Action
    icon: { sprite: _RMC14/Actions/xeno_actions.rsi, state: plant_weeds }
    useDelay: 20
  - type: InstantAction
    event: !type:SpiderWebActionEvent

- type: entity
  parent: BaseAction
  id: ActionXenoResinWall
  name: Resin wall
  description: Fortify the hive. Spawns a wall where you stand.
  components:
  - type: Action
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: resin_wall
  - type: InstantAction
    event: !type:SpawnWallActionEvent

# Other abilities
- type: entity
  parent: BaseAction
  id: ActionXenoPounce
  name: Pounce
  description: Leap forward towards your prey.
  components:
  - type: Action
    useDelay: 12
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: lunge
  - type: InstantAction
    event: !type:GravityJumpEvent {}

- type: entity
  parent: [BaseActionPolymorph, BaseDoAfterAction]
  id: ActionXenoBurrowSmall
  name: Burrow
  description: Burrows into the ground.
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: burrow
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: BurrowedSmall
  - type: DoAfterArgs
    delay: 2

- type: entity
  parent: [BaseActionPolymorph, BaseDoAfterAction]
  id: ActionXenoBurrowLarge
  name: Burrow
  description: Burrows into the ground.
  components:
  - type: Action
    useDelay: 2
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: burrow
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: BurrowedLarge
