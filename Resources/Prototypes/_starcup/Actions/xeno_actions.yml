# Nest building
- type: entity
  parent: BaseAction
  id: ActionXenoWeeds
  name: Plant weeds
  description: Expand the hive and slow assailants down.
  components:
  - type: Action
    icon: { sprite: _RMC14/Actions/xeno_actions.rsi, state: plant_weeds }
    useDelay: 30
    sound: !type:SoundCollectionSpecifier
      collection: AlienDrool
  - type: InstantAction
    event: !type:SpiderWebActionEvent

- type: entity
  parent: BaseAction
  id: ActionXenoWeedsRoyal
  name: Plant weeds
  description: Consolidate the hive. Slow assailants down.
  components:
  - type: Action
    icon: { sprite: _RMC14/Actions/xeno_actions.rsi, state: plant_weeds }
    useDelay: 20
  - type: InstantAction
    event: !type:SpiderWebActionEvent

- type: entity
  parent: BaseAction
  id: ActionXenoResinWall
  name: Resin wall
  description: Fortify the hive. Build a wall in front of you.
  components:
  - type: Action
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: resin_wall
  - type: InstantAction
    event: !type:SpawnWallAbilityActionEvent

- type: entity
  parent: BaseAction
  id: ActionXenoResinWindow
  name: Resin window
  description: Connect the hive. Build a window in front of you.
  components:
  - type: Action
    icon:
      sprite: Structures/Windows/xeno_resin.rsi
      state: full
  - type: InstantAction
    event: !type:SpawnWallAbilityActionEvent

- type: entity
  parent: BaseAction
  id: ActionXenoResinDoor
  name: Resin door
  description: Expand the hive. Build a door in front of you.
  components:
  - type: Action
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: resin_door
  - type: InstantAction
    event: !type:SpawnWallAbilityActionEvent

- type: entity
  parent: BaseAction
  id: ActionXenoBioGrowth
  name: Bioluminiscent growth
  description: Guide the hive. Plant a bioluminiscent organic growth in front of you.
  components:
  - type: Action
    icon:
      sprite: _starcup/Structures/XenoHive/xeno_tower.rsi
      state: wardingtower
  - type: InstantAction
    event: !type:SpawnWallAbilityActionEvent

# Other abilities
- type: entity
  parent: BaseAction
  id: ActionXenoPounce
  name: Pounce
  description: Leap forward towards your prey.
  components:
  - type: Action
    useDelay: 12
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: lunge
  - type: InstantAction
    event: !type:GravityJumpEvent {}

- type: entity
  parent: [BaseActionPolymorph, BaseDoAfterAction]
  id: ActionXenoBurrowSmall
  name: Burrow
  description: Burrows into the ground.
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: burrow
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: BurrowedSmall
  - type: DoAfterArgs
    delay: 2

- type: entity
  parent: [BaseActionPolymorph, BaseDoAfterAction]
  id: ActionXenoBurrowLarge
  name: Burrow
  description: Burrows into the ground.
  components:
  - type: Action
    useDelay: 2
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: burrow
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: BurrowedLarge

- type: entity
  parent: BaseAction
  id: ActionXenoCallMinion
  name: Resin wall
  description: Call forth your brood's weaker forces.
  components:
  - type: Action
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: resin_wall
  - type: InstantAction
    event: !type:SpawnWallAbilityActionEvent
