- type: entity
  parent: BaseAction
  id: ActionXenoWeeds
  name: Plant weeds
  description: Expand the hive, and slow assailants down.
  components:
  - type: Action
    icon: _RMC14/Actions/xeno_actions.rsi/plant_weeds.png
    useDelay: 30
    sound: !type:SoundCollectionSpecifier
      collection: AlienDrool
  - type: InstantAction
    event: !type:SpiderWebActionEvent

- type: entity
  parent: BaseAction
  id: ActionXenoWeedsRoyal
  name: Plant weeds
  description: Expand the hive and slow assailants down.
  components:
  - type: Action
    icon: _RMC14/Actions/xeno_actions.rsi/plant_weeds.png
    useDelay: 20
  - type: InstantAction
    event: !type:SpiderWebActionEvent

- type: entity
  parent: BaseAction
  id: ActionXenoSnot
  name: Produce mucuous
  description: Secrete semi-solid mucuous for construction.
  components:
  - type: Action
    icon: Interface/Actions/web.png
    useDelay: 20
  - type: InstantAction
    event: !type:SericultureActionEvent

- type: entity
  parent: [BaseAction, BaseDoAfterAction]
  id: ActionResinWall
  name: resin wall
  description: Fortify the hive.
  components:
  - type: Action
    useDelay: 23
    sound: !type:SoundCollectionSpecifier
      collection: AlienBuild
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: resin_wall
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: WallResin
      preventCollideWithCaster: false
      posData: !type:TargetInFrontSingle
  - type: DoAfterArgs
    delay: 7

- type: entity
  parent: [BaseAction, BaseDoAfterAction]
  id: ActionResinWallRoyal
  name: resin wall
  description: Fortify the hive.
  components:
  - type: Action
    useDelay: 35
    sound: !type:SoundCollectionSpecifier
      collection: AlienBuild
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: resin_wall
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: WallResin
      preventCollideWithCaster: false
      posData: !type:TargetInFront
  - type: DoAfterArgs
    delay: 10

- type: entity
  parent: BaseAction
  id: ActionXenoPounce
  name: Pounce
  description: Leap forward towards your prey.
  components:
  - type: Action
    useDelay: 12
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: lunge
  - type: InstantAction
    event: !type:GravityJumpEvent {}

- type: entity
  parent: [BaseActionPolymorph, BaseDoAfterAction]
  id: ActionXenoBurrowSmall
  name: Burrow
  description: Burrows into the ground.
  components:
  - type: Action
    useDelay: 2
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: burrow
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: BurrowedSmall
  - type: DoAfterArgs
    delay: 2

- type: entity
  parent: [BaseActionPolymorph, BaseDoAfterAction]
  id: ActionXenoBurrowLarge
  name: Burrow
  description: Burrows into the ground.
  components:
  - type: Action
    useDelay: 4
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: burrow
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: BurrowedLarge

- type: entity
  parent: [BaseActionPolymorph]
  id: ActionXenoCrestDefender
  name: Block
  description: Block attacks with your crest.
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: crest_defense
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: XenoCrestDefenderMorph

- type: polymorph
  id: XenoCrestDefenderMorph
  configuration:
    entity: MobXenoDefenderBlocking
    transferName: true
    inventory: None
    revertOnDeath: false
    revertOnCrit: false
    polymorphPopup: "crest-popup-exo"
    exitPolymorphPopup: "crest-revert-popup-exo"
    polymorphSound:
      collection: AlienSnarl
      params:
        volume: 0.5

- type: entity
  parent: [BaseActionPolymorph]
  id: ActionXenoChargeCrusher
  name: Charge
  description: Lower your head and plow through your enemies.
  components:
  - type: Action
    useDelay: 30
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: charge
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: XenoChargeCrusherMorph

- type: polymorph
  id: XenoChargeCrusherMorph
  configuration:
    entity: MobXenoCrusherCharging
    transferName: true
    inventory: None
    revertOnDeath: false
    revertOnCrit: false
    polymorphPopup: "crest-popup-exo"
    exitPolymorphPopup: "crest-revert-popup-exo"
    polymorphSound:
      collection: AlienRoar
      params:
        volume: 0.5
    duration: 6
