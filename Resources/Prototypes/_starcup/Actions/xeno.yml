- type: entity
  parent: BaseAction
  id: ActionXenoResin
  name: Secrete resin
  description: Vomit resin to slow the hive's enemies down.
  components:
  - type: Action
    icon: Interface/Actions/web.png
    useDelay: 25
  - type: InstantAction
    event: !type:SpiderWebActionEvent

- type: entity
  parent: BaseAction
  id: ActionXenoSnot
  name: Produce mucuous
  description: Secrete semi-solid mucuous for construction.
  components:
  - type: Action
    icon: Interface/Actions/web.png
    useDelay: 1
  - type: InstantAction
    event: !type:SericultureActionEvent

- type: entity
  parent: BaseAction
  id: ActionXenoPounce
  name: Pounce
  description: Leap forward towards your prey.
  components:
  - type: Action
    useDelay: 12
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: lunge
  - type: InstantAction
    event: !type:GravityJumpEvent {}

- type: entity
  parent: [BaseActionPolymorph, BaseDoAfterAction]
  id: ActionXenoBurrowSmall
  name: Burrow
  description: Burrows into the ground.
  components:
  - type: Action
    useDelay: 2
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: burrow
      delay: 1
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: BurrowedSmall

- type: entity
  parent: [BaseActionPolymorph, BaseDoAfterAction]
  id: ActionXenoBurrowMedium
  name: Burrow
  description: Burrows into the ground.
  components:
  - type: Action
    useDelay: 3
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: burrow
      delay: 2.5
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: BurrowedMedium

- type: entity
  parent: [BaseActionPolymorph]
  id: ActionXenoCrestDefender
  name: Block
  description: Block attacks with your crest.
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: crest_defense
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: XenoCrestDefenderMorph

- type: polymorph
  id: XenoCrestDefenderMorph
  configuration:
    entity: MobXenoDefenderBlocking
    transferName: true
    inventory: None
    revertOnDeath: false
    revertOnCrit: false
    polymorphPopup: "crest-popup-exo"
    exitPolymorphPopup: "crest-revert-popup-exo"
    polymorphSound:
      collection: AlienSnarl
      params:
        volume: 0.5

- type: entity
  parent: [BaseActionPolymorph]
  id: ActionXenoChargeCrusher
  name: Charge
  description: Lower your head and plow through your enemies.
  components:
  - type: Action
    useDelay: 1 # test purposes, make 30
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: charge
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: XenoChargeCrusherMorph

- type: polymorph
  id: XenoChargeCrusherMorph
  configuration:
    entity: MobXenoCrusherCharging
    transferName: true
    inventory: None
    revertOnDeath: false
    revertOnCrit: false
    polymorphPopup: "crest-popup-exo"
    exitPolymorphPopup: "crest-revert-popup-exo"
    polymorphSound:
      collection: AlienRoar
      params:
        volume: 0.5
    duration: 3
