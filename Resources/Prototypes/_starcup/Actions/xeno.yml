- type: entity
  parent: BaseAction
  id: ActionXenoResin
  name: Secrete resin
  description: Vomit resin to slow the hive's enemies down.
  components:
  - type: Action
    icon: Interface/Actions/web.png
    useDelay: 25
  - type: InstantAction
    event: !type:SpiderWebActionEvent

- type: entity
  parent: BaseAction
  id: ActionXenoSnot
  name: Produce mucuous
  description: Secret semi-solid mucuous for construction.
  components:
  - type: Action
    icon: Interface/Actions/web.png
    useDelay: 1
  - type: InstantAction
    event: !type:SericultureActionEvent

- type: entity
  parent: BaseAction
  id: ActionXenoPounce
  name: Pounce
  description: Leap forward towards your prey.
  components:
  - type: Action
    useDelay: 12
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: lunge
  - type: InstantAction
    event: !type:GravityJumpEvent {}

- type: entity
  parent: BaseActionPolymorph
  id: ActionBurrow
  name: Burrow
  description: Burrows into the ground.
  components:
  - type: Action
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: burrow
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: Burrowed

- type: polymorph
  id: Burrowed
  configuration:
    entity: BurrowedCreatureMedium
    transferName: false
    inventory: None
    revertOnDeath: true
    revertOnCrit: true
