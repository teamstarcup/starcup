- type: entity
  id: BaseMKCOrgan
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    netsync: false
    sprite: _EE/Mobs/Species/IPC/organs.rsi
  - type: Organ

- type: entity
  id: OrganMKCCore
  parent: BaseMKCOrgan
  name: power core
  description: Stores and provides electricity to power an MKC's chassis.
  components:
  - type: Sprite
    state: microcell
  - type: Organ
  # TODO: power core component

- type: entity
  id: OrganMKCHeart
  parent: BaseMKCOrgan
  name: micro pump
  description: Small, but powerful hydraulics allow this little miracle of robotics to distribute lubricant across an MKC's chassis.
  components:
  - type: Sprite
    state: heart-on
  - type: Organ
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [Human]
    groups:
    - id: Poison

- type: entity
  id: OrganMKCStomach
  parent: BaseMKCOrgan
  name: fluid regulator
  description: Small, but powerful hydraulics allow this little miracle of robotics to distribute lubricant across an MKC's chassis.
  components:
  - type: Sprite
    state: heart-on # TODO: need a sprite for this
  - type: Organ
  # TODO: fluid ejector component

- type: entity
  id: OrganMKCEyes
  parent: BaseMKCOrgan
  name: visual receptors
  description: Despite their similarity to eyeballs, these sensory devices are usually kept inside an MKC's chassis for safekeeping.
  components:
  - type: Sprite
    layers:
    - state: eyeball-l
    - state: eyeball-r
  - type: Organ

- type: entity
  id: OrganMKCTongue
  parent: BaseMKCOrgan
  name: vocal synthesizer
  description: A vocal synthesizer, capable of producing speech using complex audio software.
  components:
  - type: Sprite
    state: tongue
  - type: Organ

- type: entity
  id: OrganMKCEars
  parent: BaseMKCOrgan
  name: sonic receptors
  description: A paired set of devices that allow silicons to hear as a biological being might.
  components:
  - type: Sprite
    state: ears
  - type: Organ
