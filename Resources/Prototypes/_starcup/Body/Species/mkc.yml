- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceMKC
  name: MKC appearance
  components:
  - type: Inventory
    speciesId: mkc
  - type: EntityTableContainerFill
    containers:
      body_organs: !type:AllSelector
        children:
        - id: OrganMKCTorso
        - id: OrganMKCHead
        - id: OrganMKCArmLeft
        - id: OrganMKCArmRight
        - id: OrganMKCHandRight
        - id: OrganMKCHandLeft
        - id: OrganMKCLegLeft
        - id: OrganMKCLegRight
        - id: OrganMKCFootLeft
        - id: OrganMKCFootRight
        - id: PositronicBrain
        - id: OrganMKCEyes
        - id: OrganMKCTongue
        - id: OrganMKCEars
        - id: OrganMKCPump
        - id: OrganMKCStomach
        - id: OrganMKCCore
  - type: HumanoidAppearance
    species: MKC

- type: entity
  parent:
  - AppearanceMKC
  - BaseSpeciesMobSilicon
  id: MobMKC
  name: Urist McPositronic
  components:
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
        - ReagentId: Oil
          Quantity: 300
    bloodRefreshAmount: 0
  - type: Barotrauma
    damage:
      types:
        Heat: 0.6 # from 0.1, blunt damage removed
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 42
  - type: TemperatureDamage # mirrored from parent, changes noted
    heatDamageThreshold: 365 # from 325
    coldDamageThreshold: 200 # from 260
    coldDamage:
      types:
        Cold: 0.1
    heatDamage:
      types:
        Heat: 1.5
  - type: TemperatureSpeed # mirrored from parent, changes noted
    thresholds:
      235: 0.9 # from 293
      220: 0.8 # from 280
      200: 0.7 # from 260
  - type: ThermalRegulator # mirrored from parent, changes noted
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 250 # from 500
    sweatHeatRegulation: 1000 # from 2000
    shiveringHeatRegulation: 1000 # from 2000
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 10 # from 2
  - type: TriggerOnEmp
  - type: StunOnTrigger
    stunAmount: 10
  - type: KnockdownOnTrigger
    knockdownAmount: 10
    autoStand: false
  - type: EntityEffectOnTrigger
    effects:
      - !type:ModifyStatusEffect
        effectProto: StatusEffectMuted
        time: 10

- type: entity
  parent: OrganBase
  id: OrganMKC
  abstract: true
  suffix: MKC
  components:
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Oil
          Quantity: 10

- type: entity
  parent: OrganMKC
  id: OrganMKCInternal
  abstract: true
  components:
  - type: Sprite
    sprite: _EE/Mobs/Species/IPC/organs.rsi

- type: entity
  parent: OrganMKC
  id: OrganMKCExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _EE/Mobs/Species/IPC/parts.rsi

- type: entity
  parent: [ OrganBaseTorso, OrganMKCExternal ]
  id: OrganMKCTorso

- type: entity
  parent: [ OrganBaseHead, OrganMKCExternal ]
  id: OrganMKCHead

- type: entity
  parent: [ OrganBaseArmLeft, OrganMKCExternal ]
  id: OrganMKCArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganMKCExternal ]
  id: OrganMKCArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganMKCExternal ]
  id: OrganMKCHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganMKCExternal ]
  id: OrganMKCHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganMKCExternal ]
  id: OrganMKCLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganMKCExternal ]
  id: OrganMKCLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganMKCExternal ]
  id: OrganMKCFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganMKCExternal ]
  id: OrganMKCFootRight

- type: entity
  parent: [ OrganBaseEyes, OrganMKCInternal ]
  id: OrganMKCEyes
  name: visual receptors
  description: Despite their similarity to eyeballs, these sensory devices are usually kept inside an MKC's chassis for safekeeping.

- type: entity
  parent: [ OrganBaseTongue, OrganMKCInternal ]
  id: OrganMKCTongue
  name: vocal synthesizer
  description: A vocal synthesizer, capable of producing speech using complex audio software.

- type: entity
  parent: [ OrganBaseEars, OrganMKCInternal ]
  id: OrganMKCEars
  name: sonic receptors
  description: A paired set of devices that allow silicons to hear as a biological being might.

- type: entity
  id: OrganMKCCore
  parent: OrganMKCInternal
  name: power core
  description: Stores and provides electricity to power an MKC's chassis.
  components:
  - type: Sprite
    state: microcell
  - type: Battery
    maxCharge: 1920
    startingCharge: 1920
  - type: PowerCore

- type: entity
  id: OrganMKCPump
  parent: OrganMKCInternal
  name: micro pump
  description: Small, but powerful hydraulics allow this little miracle of robotics to distribute lubricant across an MKC's chassis.
  components:
  - type: Sprite
    state: heart-on
  - type: Organ
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [MKC]
    groups:
      - id: Poison
    # TODO: nanite metabolism group

- type: entity
  id: OrganMKCStomach
  parent: OrganMKCInternal
  name: fluid regulator
  description: Collects built-up fluids from across an MKC's body, then violently expels them.
  components:
  - type: Sprite
    state: stomach
  - type: FluidEjector
    ejectionDamage:
      types:
        Piercing: 1
    ejectionDamageMultiplier: 0.8  # per unit of expelled reagent
