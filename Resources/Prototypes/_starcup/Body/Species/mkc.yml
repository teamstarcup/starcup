      onlyGroupWhitelisted: false
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      onlyGroupWhitelisted: false
      required: false
    enum.HumanoidVisualLayers.HeadBase:
      limit: 1
      required: true
      default: [ MobMKCHeadDefault ]
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: true
      default: [ MobMKCTorsoDefault ]
    enum.HumanoidVisualLayers.Overlay:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: true
      default: [ MobMKCLArmDefault ]
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: true
      default: [ MobMKCRArmDefault ]
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: true
      default: [ MobMKCLHandDefault ]
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: true
      default: [ MobMKCRHandDefault ]
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: true
      default: [ MobMKCLLegDefault ]
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: true
      default: [ MobMKCRLegDefault ]
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: true
      default: [ MobMKCLFootDefault ]
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: true
      default: [ MobMKCRFootDefault ]

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceMKC
  name: MKC appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganMKCTorso
      Head: OrganMKCHead
      ArmLeft: OrganMKCArmLeft
      ArmRight: OrganMKCArmRight
      HandRight: OrganMKCHandRight
      HandLeft: OrganMKCHandLeft
      LegLeft: OrganMKCLegLeft
      LegRight: OrganMKCLegRight
      FootLeft: OrganMKCFootLeft
      FootRight: OrganMKCFootRight
      Brain: PositronicBrain
      Eyes: OrganMKCEyes
      Tongue: OrganMKCTongue
      Ears: OrganMKCEars
      Heart: OrganMKCPump
      FluidRegulator: OrganMKCStomach
      PowerCore: OrganMKCCore
  - type: HumanoidProfile
    species: MKC

- type: entity
  parent:
  - AppearanceMKC
  - BaseSpeciesMobSilicon
  id: MobMKC
  name: Urist McPositronic
  components:
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
        - ReagentId: Oil
          Quantity: 300
    bloodRefreshAmount: 0
  - type: Barotrauma
    damage:
      types:
        Heat: 0.6 # from 0.1, blunt damage removed
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 42
  - type: TemperatureDamage # mirrored from parent, changes noted
    heatDamageThreshold: 365 # from 325
    coldDamageThreshold: 200 # from 260
    coldDamage:
      types:
        Cold: 0.1
    heatDamage:
      types:
        Heat: 1.5
  - type: TemperatureSpeed # mirrored from parent, changes noted
    thresholds:
      235: 0.9 # from 293
      220: 0.8 # from 280
      200: 0.7 # from 260
  - type: ThermalRegulator # mirrored from parent, changes noted
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 250 # from 500
    sweatHeatRegulation: 1000 # from 2000
    shiveringHeatRegulation: 1000 # from 2000
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 10 # from 2
  - type: TriggerOnEmp
  - type: StunOnTrigger
    stunAmount: 10
  - type: KnockdownOnTrigger
    knockdownAmount: 10
    autoStand: false
  - type: EntityEffectOnTrigger
    effects:
      - !type:ModifyStatusEffect
        effectProto: StatusEffectMuted
        time: 10
  - type: CriticalDamage
    damage:
      types:
        Heat: 1
    emote: Buzz-Two

- type: entity
  parent: OrganBase
  id: OrganMKC
  abstract: true
  suffix: MKC
  components:
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Oil
          Quantity: 10

- type: entity
  parent: OrganMKC
  id: OrganMKCInternal
  abstract: true
  components:
  - type: Sprite
    sprite: _starcup/Mobs/Species/MKC/organs.rsi

- type: entity
  id: OrganMKCVisual
  abstract: true
  components:
  - type: VisualOrgan
    data:
      sprite: _starcup/Mobs/Species/MKC/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: MKC

- type: entity
  parent: [ OrganMKC, OrganMKCVisual ]
  id: OrganMKCExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _starcup/Mobs/Species/MKC/parts.rsi
  - type: VisualOrgan
    data:
      sprite: null
      state: null
    sexStateOverrides:
      Male: null
      Female: null

- type: entity
  parent: [ OrganMKCExternal, OrganBaseTorsoSexed, OrganBaseTorso ]
  id: OrganMKCTorso

- type: entity
  parent: [ OrganMKCExternal, OrganBaseHeadSexed, OrganBaseHead ]
  id: OrganMKCHead

- type: entity
  parent: [ OrganBaseArmLeft, OrganMKCExternal ]
  id: OrganMKCArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganMKCExternal ]
  id: OrganMKCArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganMKCExternal ]
  id: OrganMKCHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganMKCExternal ]
  id: OrganMKCHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganMKCExternal ]
  id: OrganMKCLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganMKCExternal ]
  id: OrganMKCLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganMKCExternal ]
