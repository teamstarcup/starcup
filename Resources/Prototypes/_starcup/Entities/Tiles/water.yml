- type: entity
  parent: FloorWaterEntity
  id: FloorWaterEntityEdges
  suffix: with edges
  components:
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: Icon
    sprite: Tiles/Planet/water.rsi
    state: shoreline_water
  - type: SmoothEdge
  - type: Sprite
    sprite: _starcup/Tiles/Planet/water_shoreline.rsi
    layers:
    - sprite: Tiles/Planet/water.rsi
      state: shoreline_water
    - map: [ "enum.EdgeLayer.South" ]
      state: double_edge_south
    - map: [ "enum.EdgeLayer.East" ]
      state: double_edge_east
    - map: [ "enum.EdgeLayer.North" ]
      state: double_edge_north
    - map: [ "enum.EdgeLayer.West" ]
      state: double_edge_west

- type: entity
  parent: FloorWaterEntity
  id: FloorWaterEntityDeep
  name: deep water
  description: That's a paddlin'.
  components:
  - type: Sprite
    sprite: _starcup/Tiles/Planet/water_deep.rsi
    layers:
    - state: base
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Effects/Fluids/watersplash.ogg

- type: entity
  parent: FloorWaterEntityDeep
  id: FloorWaterEntityDeepEdges
  suffix: with edges
  components:
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: Icon
    sprite: _starcup/Tiles/Planet/water_deep.rsi
    state: base
  - type: SmoothEdge
  - type: Sprite
    sprite: _starcup/Tiles/Planet/water_deep.rsi
    layers:
    - sprite: _starcup/Tiles/Planet/water_deep.rsi
      state: base
    - map: [ "enum.EdgeLayer.South" ]
      state: double_edge_south
    - map: [ "enum.EdgeLayer.East" ]
      state: double_edge_east
    - map: [ "enum.EdgeLayer.North" ]
      state: double_edge_north
    - map: [ "enum.EdgeLayer.West" ]
      state: double_edge_west
