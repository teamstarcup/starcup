- type: entity
  id: FloorStarcupMagmaEntity
  name: magma
  description: Walking over hot coal, pro-walker edition.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: FloorOccluder
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: _starcup/Tiles/Planet/tallgrass.rsi
    drawdepth: BelowFloor
  - type: Icon
    sprite: _starcup/Tiles/Planet/tallgrass.rsi
    state: base_preview
  - type: Transform
    anchored: true
  - type: IconSmooth
    key: base
    base: base_
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: Damageable
    damageContainer: Inorganic
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Weapons/slash.ogg"
        params:
          variation: 0.05
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Slash
        damage: 22
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
