- type: entity
  parent: ClothingBackpackCaptain
  id: ClothingBackpackCaptainSyndie
  description: It's a special backpack made exclusively for Syndicate officers.
  suffix: Syndicate
  components:
  - type: Sprite
    sprite: _starcup/Clothing/Back/Backpacks/captain_syndi.rsi

# Syndicate
- type: entity
  parent: [BaseNanotrasenContraband, ClothingBackpackSyndicate]
  id: ClothingBackpackNanotrasen
  name: NanoTrasen backpack
  description:
  components:
  - type: Sprite
    sprite: _starcup/Clothing/Back/Backpacks/nanotrasen.rsi
  - type: ExaminableClothing
    examineText: clothing-nanotrasen-backpack

# Color variants
- type: entity
  id: ClothingBackpackColorable
  parent: ClothingBackpack
  name: white backpack
  components:
  - type: Sprite
    sprite: _starcup/Clothing/Back/Backpacks/backpack_colorable.rsi

- type: entity
  id: ClothingBackpackBlue
  parent: ClothingBackpackColorable
  name: blue backpack
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#4694d2"
      right:
      - state: inhand-right
        color: "#4694d2"
  - type: Clothing
    clothingVisuals:
      back:
      - state: equipped-BACKPACK
        color: "#4694d2"
  - type: Sprite
