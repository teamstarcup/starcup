- type: entity
  parent: [ ClothingBackpackDuffel, BaseSyndCommContraband ]
  id: ClothingBackpackDuffelSyndComm
  name: SyndComm duffel bag
  description: A stylish SyndComm-branded duffel bag.
  components:
  - type: Sprite
    sprite: _starcup/Clothing/Back/Duffels/syndcomm.rsi
  - type: ClothingSpeedModifier
    sprintModifier: 1  # no penalty

# Color variants
- type: entity
  parent: ClothingBackpackDuffel
  id: ClothingBackpackDuffelBlue
  name: blue duffel bag
  components:
