    inhandVisuals:
      left:
      - state: inhand-left
      - state: inhand-left_colored
        color: "#4694d2"
      right:
      - state: inhand-right
      - state: inhand-right_colored
        color: "#4694d2"
  - type: Clothing
    clothingVisuals:
      back:
      - state: equipped-BACKPACK
      - state: equipped-BACKPACK_colored
        color: "#4694d2"
  - type: Sprite
    sprite: _starcup/Clothing/Back/Duffels/duffel_colorable.rsi
    layers:
    - state: icon
