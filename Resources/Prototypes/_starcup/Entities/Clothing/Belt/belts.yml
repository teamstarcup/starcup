# SHEATHS

- type: entity
  parent: [ClothingBeltBase, ClothingSlotBase, BaseExaminableClothing]
  id: ClothingBeltSheathBase
  abstract: true
  components:
  - type: Item
    size: Ginormous
    shape:
    - 0,0,1,2
    storedOffset: 0,-2
    storedRotation: 45
  - type: Appearance

# The filled equipped sheaths won't show up on the sprites as such.
# We'll leave it just in case ItemMapper gets an upgrade later.

- type: entity
  parent: ClothingBeltSheathBase
  id: ClothingBeltSheathSabrePlain
  name: dueling sabre sheath
  description: A fancy sheath designed to hold a dueling sabre.
  components:
  - type: Sprite
    sprite: _starcup/Clothing/Belt/dueling_sabre_sheath.rsi
    state: sheath
  - type: Clothing
    sprite: _starcup/Clothing/Belt/dueling_sabre_sheath.rsi
  - type: ItemSlots
    slots:
      item:
        name: spray-painter-style-cratesecure-weapon # hey, it's there
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        ejectOnBreak: true
        whitelist:
          tags:
          - SabrePlain
  - type: ItemMapper
    mapLayers:
      sheath-sabre:
        whitelist:
          tags:
          - SabrePlain

