# These are the action buttons, actions, and mobs, to represent burrowing, all packed together for convenience.
# This works by using the polymorph system to polymorh the mob into a burrowed mob, either medium or small.

# Actions that go on the user bar

- type: entity
  parent: [BaseActionPolymorph, BaseDoAfterAction]
  id: ActionBurrowSmall
  name: Burrow
  description: Burrows into the ground.
  components:
  - type: Action
    useDelay: 3
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: burrow
      delay: 2.5
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: BurrowedSmall

- type: entity
  parent: [BaseActionPolymorph, BaseDoAfterAction]
  id: ActionBurrowMedium
  name: Burrow
  description: Burrows into the ground.
  components:
  - type: Action
    useDelay: 3
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: burrow
      delay: 2.5
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: BurrowedMedium

# Action events

- type: polymorph
  id: BurrowedSmall
  configuration:
    entity: BurrowedCreatureSmall
    transferName: false
    inventory: None
    revertOnDeath: true
    revertOnCrit: true
    polymorphPopup: "burrowing-popup-generic"
    exitPolymorphPopup: "burrowing-revert-popup-generic"
    polymorphSound:
      path: /Audio/_starcup/Effects/Burrowing/burrow_on.ogg
      params:
        volume: 0.1
    exitPolymorphSound:
      path: /Audio/_starcup/Effects/Burrowing/burrow_off.ogg

- type: polymorph
  id: BurrowedMedium
  configuration:
    entity: BurrowedCreatureMedium
    transferName: false
    inventory: None
    revertOnDeath: true
    revertOnCrit: true
    polymorphPopup: "burrowing-popup-generic"
    exitPolymorphPopup: "burrowing-revert-popup-generic"
    polymorphSound:
      path: /Audio/_starcup/Effects/Burrowing/burrow_on.ogg
      params:
        volume: 0.1
    exitPolymorphSound:
      path: /Audio/_starcup/Effects/Burrowing/burrow_off.ogg

# Burrowed mobs

- type: entity
  id: BurrowedCreatureSmall
  name: burrowed creature
  suffix: small
  parent:
    - BaseMob
    - MobDamageable
  description: Something hides underground.
  components:
  - type: Sprite
    noRot: true
    sprite: _starcup/Mobs/Special/burrowed_small.rsi
    drawdepth: FloorObjects
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: burrowed
      sprite: _starcup/Mobs/Special/burrowed_small.rsi
  - type: SpriteMovement
    movementLayers:
      movement:
        state: burrowed-moving
    noMovementLayers:
      movement:
        state: burrowed
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        mask:
        - Impassable
  - type: Insulated
  - type: Temperature
    heatDamageThreshold: 360
    coldDamageThreshold: -150
    currentTemperature: 310.15
  - type: Tag
    tags:
    - CannotSuicide
    - FootstepSound
  - type: MovementSpeedModifier
    baseWalkSpeed : 0
    baseSprintSpeed : 0
  - type: NoSlip
  - type: FootstepModifier
    footstepSoundCollection:
      collection: Burrowing

- type: entity
  id: BurrowedCreatureMedium
  name: burrowed creature
  suffix: medium
  parent: BurrowedCreatureSmall
  description: Something hides underground.
  components:
  - type: Sprite
    noRot: true
    sprite: _starcup/Mobs/Special/burrowed_medium.rsi
    drawdepth: FloorObjects
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: burrowed
      sprite: _starcup/Mobs/Special/burrowed_medium.rsi
  - type: FootstepModifier
    footstepSoundCollection:
      collection: BurrowingLarge
