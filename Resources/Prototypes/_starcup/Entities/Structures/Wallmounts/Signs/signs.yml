# Misc

- type: entity
  parent: BaseSignPullDown
  id: SignChemDiamond
  name: fire diamond sign
  description: An NFPA 704 'fire diamond' indicating chemical handling hazards. Blue for health hazard, red for fire hazard, yellow for reactivity, and white for specific hazards. Higher numbers mean more hazardous.
  components:
  - type: Sprite
    sprite: _starcup/Structures/Wallmounts/Signs/tg.rsi
    state: chemdiamond
  - type: DisassembleOnAltVerb
    prototypeToSpawn: SignCarriedChemDiamond

