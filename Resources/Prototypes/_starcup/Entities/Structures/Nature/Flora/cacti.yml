# Base cacti
- type: entity
  parent: BaseTree
  id: BaseCactus
  abstract: true
  name: cactus
  description: Hardy plant that can store fluids and thrives across the galaxy.
  components:
  - type: Sprite
    sprite: _starcup/Structures/Nature/Flora/Cacti/flora_cactus.rsi
    layers:
    - state: cactus01
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        cactus01: ""
        cactus02: ""
        cactus03: ""
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.3"
        density: 4000
        layer:
        - WallLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 65
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/_starcup/Effects/branch_break.ogg
          params:
            volume: 3
            variation: 0.05
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnInteract
    damage:
      types:
        Piercing: 0.9
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Sugar
        Quantity: 120
      - ReagentId: Water
        Quantity: 80

