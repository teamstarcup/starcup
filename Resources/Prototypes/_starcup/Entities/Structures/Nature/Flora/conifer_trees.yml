# Original trees
- type: entity
  parent: BaseTreeConifer
  id: FloraTreeTamarack
  name: tamarack
  description: Golden and olive pines, the swans of the hill and the cliff.
  components:
  - type: Sprite
    sprite: _starcup/Structures/Nature/Flora/Trees/ConiferTrees/flora_tamaracks.rsi
    layers:
    - state: tree01
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        tree01: ""
        tree02: ""
        tree03: ""
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/tree_fell.ogg
          params:
            volume: 5
            variation: 0.05
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          Log:
            min: 1
            max: 8
          TamarackStump:
            min: 1
            max: 1

- type: entity
  parent: BaseStumpStarcup
  id: TamarackStump
  components:
  - type: Sprite
    sprite: _starcup/Structures/Nature/Flora/Trees/ConiferTrees/flora_tamaracks.rsi
    state: treestump

