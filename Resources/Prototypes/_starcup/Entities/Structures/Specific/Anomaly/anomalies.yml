- type: entity
  parent: BaseAnomaly
  id: AnomalyFloraGloamflower
  name: Gloamflower anomaly
  description: An unusually stable anomaly of flowers and light. Should you be standing this close to it?
  suffix: Flora, Ptarmigan Variant
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Structures/Specific/Anomalies/flora_anom.rsi
    layers:
    - state: anom
      map: ["enum.AnomalyVisualLayers.Base"]
    - state: pulse
      map: ["enum.AnomalyVisualLayers.Animated"]
      visible: false
  - type: PointLight
    falloff: 10.0
    energy: 4.5
    radius: 6.5 # subtler glow
    color: "#6270bb"
  - type: Anomaly
    animationTime: 6
    offset: 0, 0
    corePrototype: AnomalyCoreFlora
    coreInertPrototype: RandomAnomalyCoreFlora
    minPulseLength: 180
    maxPulseLength: 200 # develops slower
    decayThreshold: 0.01 # slow to fall apart
    maxPointsPerSecond: 25 # low point production
    cannotSupercrit: True # extremely stable
    supercriticalSoundAtAnimationStart:
      path: /Audio/_starcup/silence.ogg
    supercriticalSound:
      path: /Audio/Magic/Eldritch/voidblink.ogg # maybe we go a little spooky with it
  - type: TileSpawnAnomaly
    entries:
    - settings:
        spawnOnPulse: true
        minAmount: 3
        maxAmount: 7
        maxRange: 5
      floor: FloorAstroGrass
    - settings:
        spawnOnSuperCritical: true
        minAmount: 10
        maxAmount: 30
        maxRange: 15
      floor: FloorAstroGrass
  - type: EntitySpawnAnomaly
    entries:
    - settings:
        spawnOnPulse: true
        minAmount: 1
        maxAmount: 4 # milder kudzu production
        maxRange: 1 # shorter range than normal.
      spawns:
      - KudzuFlowerFriendly
    - settings:
        spawnOnSuperCritical: true
        minAmount: 5
        maxAmount: 10
        maxRange: 6
      spawns:
      - KudzuFlowerAngry
