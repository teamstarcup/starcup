- type: entity
  id: XenoWeedsBase
  abstract: true
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: PlacementReplacement
    key: web
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Weapons/slash.ogg"
  - type: Sprite
    sprite: _starcup/Structures/XenoHive/xeno_weeds.rsi
    drawdepth: LowFloors
  - type: Appearance
  - type: Clickable
  - type: Transform
    anchored: true
  - type: Physics
  - type: Damageable
    damageModifierSet: ExomorphDefense
  - type: Flammable
    fireSpread: true
    damage:
      types:
        Heat: 10
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
  - type: SpiderWebObject
  - type: IconSmooth
    key: weeds
    additionalKeys:
    - walls
    base: weeds_

- type: entity
  id: XenoWeeds
  parent: XenoWeedsBase
  name: exomorph weeds
  description: Slimy and sticky alien secretions.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        density: 10
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - MidImpassable
  - type: Destructible
    thresholds:
    - trigger: # Excess damage, don't spawn entities
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
    ignoreWhitelist:
      components:
      - IgnoreSpiderWeb

- type: entity
  parent: BaseWall
  id: WallXenoResin
  name: resin wall
  description: Shell of the exomorph hive.
  components:
  - type: Tag
    tags:
    - Wall
    - Structure
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi
  - type: Icon
    sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi
  - type: Damageable
    damageModifierSet: ExomorphDefense
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: OrganicDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          XenoWeeds:
            min: 1
  - type: IconSmooth
    key: walls
    base: resin
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/_RMC14/Xeno/alien_claw_block.ogg"
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          MeatBulletImpact
    soundTypes:
      Heat:
        collection:
          MeatLaserImpact

- type: entity
  id: XenoResinDoor
  parent: BaseMaterialDoorNavMap
  name: resin door
  description: A slick, sealing gateway in and out of the hive.
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/_RMC14/Xeno/alien_claw_block.ogg"
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          MeatBulletImpact
    soundTypes:
      Heat:
        collection:
          MeatLaserImpact
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_resin_door.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: AnimationPlayer
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49" # don't want this colliding with walls or they won't close
        density: 100
        mask:
        - FullTileMask
        layer:
        - AirlockLayer
  - type: Door
    openSound:
      path: /Audio/_RMC14/Xeno/alien_resin_move1.ogg
    closeSound:
      path: /Audio/_RMC14/Xeno/alien_resin_move2.ogg
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: ExomorphDefense
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: OrganicDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          XenoWeeds:
            min: 1
            max: 1

- type: entity
  id: XenoBioluminiscentGrowth
  name: biolomuniscent growth
  suffix: green
  description: It twitches every now and then...
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          MeatBulletImpact
    soundTypes:
      Heat:
        collection:
          MeatLaserImpact
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _starcup/Structures/XenoHive/xeno_tower.rsi
    layers:
    - state: wardingtower
    - state: wardingtower-unshaded
      shader: unshaded
  - type: Damageable
    damageModifierSet: ExomorphDefense
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: OrganicDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          XenoWeeds:
            min: 1
            max: 1
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: PointLight
    radius: 5
    energy: 1
    color: "#f1fa89"
  - type: SpamEmitSound
    minInterval: 60
    maxInterval: 360
    sound:
      collection: AlienBuildTwitch

- type: entity
  id: XenoBioluminiscentGrowthBlue
  parent: XenoBioluminiscentGrowth
  components:
  - type: Sprite
    layers:
    - state: recoverytower
  - type: PointLight
    color: "#a4e8ff"

- type: entity
  id: XenoBioluminiscentGrowthRed
  parent: XenoBioluminiscentGrowth
  suffix: red
  components:
  - type: Sprite
    layers:
    - state: frenzytower
  - type: PointLight
    color: "#eb608f"
