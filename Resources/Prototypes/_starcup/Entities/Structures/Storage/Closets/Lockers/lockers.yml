- type: entity
  parent: LockerBaseSecure
  id: LockerAdministrativeAssistant
  name: administrative assistant's locker
  components:
  - type: Sprite
    sprite: _starcup/Structures/Storage/closet.rsi
    layers: &GenericLockerLayers
    - state: generic
      map: [ "enum.StorageVisualLayers.Base" ]
      sprite: Structures/Storage/closet.rsi
    - state: generic_door
      map: [ "enum.StorageVisualLayers.Door" ]
      sprite: Structures/Storage/closet.rsi
    - state: locked
      map: [ "enum.LockVisualLayers.Lock" ]
      sprite: Structures/Storage/closet.rsi
      shader: unshaded
    - state: welded
      visible: false
      map: [ "enum.WeldableLayers.BaseWelded" ]
      sprite: Structures/Storage/closet.rsi
    - state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      offset: "-0.065,0"
      map: [ "enum.PaperLabelVisuals.Layer" ]
  - type: EntityStorageVisuals
    stateBaseClosed: admin_assist
    stateDoorOpen: admin_assist_open
    stateDoorClosed: admin_assist_door
  - type: AccessReader
    access: [["Command"]]

