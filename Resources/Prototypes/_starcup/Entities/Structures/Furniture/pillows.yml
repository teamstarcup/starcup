- type: entity
  name: command comfort deployment unit
  parent: EmergencyComfortDeploymentUnitWrapped
  id: EmergencyComfortDeploymentUnitCommandWrapped
  description: The Command Comfort Deployment Unit, for resting a head weary with the burdens of leadership. Deploy as needed.
  components:
  - type: Sprite
    sprite: /Textures/_starcup/Structures/Furniture/departmental_pillows.rsi
    state: CommandWrapped
  - type: Item
    size: Normal
  - type: SpawnItemsOnUse
    items:
      - id: EmergencyComfortDeploymentUnitCommandUnwrapped
    sound:
      path: /Audio/Misc/zip.ogg

- type: entity
  name: deployed command comfort unit
  parent: EmergencyComfortDeploymentUnitUnwrapped
  id: EmergencyComfortDeploymentUnitCommandUnwrapped
  description: The Command Comfort Deployment Unit, for resting a head weary with the burdens of leadership.
  components:
  - type: Sprite
    sprite: /Textures/_starcup/Structures/Furniture/departmental_pillows.rsi
    state: CommandUnwrapped
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 0
    soundHit:
      collection: storageRustle

