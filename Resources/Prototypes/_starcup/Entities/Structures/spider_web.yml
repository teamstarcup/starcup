- type: entity
  id: SpiderWebNurse
  parent: SpiderWeb
  name: nurse spider web
  components:
  - type: Sprite
    color: "#74feff"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWebSilkNurse:
            min: 0
            max: 1

- type: entity
  parent: MaterialWebSilk
  id: MaterialWebSilkNurse
  name: nurse silk
  description: A webby material produced by the nurse spider.
  suffix: Full
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      WebSilkNurse: 100
  - type: Sprite
    sprite: _starcup/Objects/Materials/silk.rsi
    state: icon
  - type: Stack
    count: 50
    stackType: WebSilkNurse
  - type: Edible
    requiresSpecialDigestion: true
    solution: composite
  - type: FlavorProfile
    flavors:
    - cobwebs
    ignoreReagents:
    - Fiber
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fiber
        Quantity: 10
  - type: Tag
    tags:
    - ClothMade
    - RawMaterial
  - type: Item
    sprite: _starcup/Objects/Materials/silk.rsi
    heldPrefix: silk

- type: entity
  parent: MaterialWebSilkNurse
  id: MaterialWebSilkNurse25
  suffix: 25
  components:
  - type: Stack
    count: 25

- type: entity
  parent: MaterialWebSilkNurse
  id: MaterialWebSilkNurse1
  suffix: 1
  components:
  - type: Stack

- type: stack
  parent: BaseLargeStack
  id: WebSilkNurse
  name: stack-silk-nurse
  icon: { sprite: _starcup/Objects/Materials/silk.rsi, state: icon }
  spawn: MaterialWebSilkNurse1

# Projectiles
- type: entity
  parent: BaseBulletTrigger
  id: BulletWeb
  name: web pellet
  categories: [ HideSpawnMenu ]
  components:
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: Sprite
    sprite: Objects/Materials/silk.rsi
    layers:
    - state: icon
  - type: Ammo
    muzzleFlash: null
  - type: Physics
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.05,-0.05,0.05,0.05"
        hard: false
        mask:
        - Opaque
      fly-by: &flybyfixture
        shape: !type:PhysShapeCircle
          radius: 1.5
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: False
  - type: Projectile
    impactEffect: WebPelletEffect
    damage:
      types:
        Blunt: 5
  - type: TimedDespawn
    lifetime: 0.5
  - type: SpawnOnDespawn
    prototype: SpiderWeb
  - type: SpawnOnTrigger
    proto: SpiderWeb
  - type: DeleteOnTrigger

- type: entity
  parent: BulletWeb
  id: BulletWebNurse
  name: web pellet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Materials/silk.rsi
    color: "#74feff"
    layers:
    - state: icon
  - type: TimedDespawn
    lifetime: 0.5
  - type: SpawnOnDespawn
    prototype: SpiderWebNurse
  - type: SpawnOnTrigger
    proto: SpiderWebNurse
  - type: DeleteOnTrigger

- type: entity
  id: WebPelletEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Tag
    tags:
    - HideContextMenu
