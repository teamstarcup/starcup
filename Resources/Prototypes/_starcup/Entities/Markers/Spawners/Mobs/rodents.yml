# Timed spawns
# We don't use these, as they don't create gameplay that we find particularly fun or engaging in our server.
# I have however included it for completion's sake.
- type: entity
  id: RatTimedSpawner
  name: Rat Timed Spawner
  parent: TimedSpawnerBaseStarcup
  components:
  - type: Sprite
    layers:
    - state: shadow
    - state: blue
    - sprite: _starcup/Mobs/Animals/Rodents/generic_spawners.rsi
      state: rats
    - sprite: Markers/cross.rsi
      state: timed
  - type: TimedSpawner
    prototypes:
    - MobRat
    - MobRatGray
    - MobRatWhite
    - MobRatLarge
    - MobRatLargeBlue
    - MobRatLargeBrown
