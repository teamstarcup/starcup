# Mice
- type: entity
  parent: MarkerBaseStarcup
  id: SpawnMobMouseFat
  name: Fat Mouse Spawner
  components:
  - type: Sprite
    layers:
    - state: shadowgreen
    - state: green
    - sprite: _starcup/Mobs/Animals/Rodents/fat_mouse.rsi
      state: icon-1
    - state: ai
  - type: ConditionalSpawner
    prototypes:
    - MobMouseFat
    - MobMouseFat1
    - MobMouseFat2

