- type: entity
  id: RandomCandy
  name: random candy spawner
  parent: MarkerBase
  placement:
    mode: AlignTileAny
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _DV/Objects/Consumable/Food/candy.rsi
      state: lollipop
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: RandomCandyTable

- type: entityTable # price 100
  id: FlavoredChocolateHeartsTable
  table: !type:AllSelector
    children:
    - !type:GroupSelector
      children:
      - id: FoodChocolateHeartDark
        amount: 1
      - id: FoodChocolateHeartWhite
        amount: 1
