#Spaceblades (except the NT and Syndicate ones)
- type: entityTable
  id: AllSpacebladesTable
  table: !type:GroupSelector
    children:
    - !type:GroupSelector #Common spaceblades
      weight: 0.6
      children:
      - id: SpaceBladeRedOrange
      - id: SpaceBladeBlue
      - id: SpaceBladeGoldBlue
      - id: SpaceBladeMail
      - id: SpaceBladeEyeball
      - id: SpaceBladeBlade
      - id: MysterySpaceBladeBox
      - id: SpaceBladeCalico
      - id: SpaceBladeDuality
    - !type:GroupSelector #Uncommon spaceblades
      weight: 0.3
      children:
      - id: SpaceBladeCheck
      - id: SpaceBladeMoff
      - id: SpaceBladePizza
      - id: SpaceBladeWeh
      - id: SpaceBladeClown
      - id: SpaceBladeSC
      - id: SpaceBladeFrontier
    - !type:GroupSelector #Rare spaceblades
      weight: 0.1
      children:
      - id: SpaceBladeTesla
      - id: SpaceBladeSingularity
      - id: SpaceBladeContra

- type: entity
  name: SpaceBlade Spawner
  id: SpaceBladeSpawner
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - sprite: _NF/Objects/Fun/spaceblade.rsi
          state: sb_box
    - type: EntityTableSpawner
      table: !type:NestedSelector
        tableId: AllSpacebladesTable


- type: entity
  name: Random Prize Spawner
  id: RandomPrizeSpawner
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _EE/Objects/Fun/prizeticket.rsi
      state: prizeball
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: AllPrizesTable

- type: entityTable
  id: AllPrizesTable
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
        tableId: AllToysTable
        weight: 75
    - !type:NestedSelector
        tableId: TinyInstrumentTable
        weight: 10
    - !type:GroupSelector
        weight: 5
        children:
        - id: ClothingNeckNecklaceGold
        - id: ClothingNeckNecklaceSilver
        - id: ClothingHeadHatCuteTiara
        - id: ClothingHeadHatSimpleTiara
        - id: ClothingNeckNecklacePendantGoldRuby
    - !type:NestedSelector
        tableId: RandomCandyTable
        weight: 10
