# Spawners
- type: entity
  parent: RandomPosterLegit
  id: RandomPosterLegitSyndie
  name: "random legit poster spawner (syndie)"
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Structures/Wallmounts/posters.rsi
      state: random_contraband
  - type: EntityTableSpawner
    offset: 0
    table: !type:NestedSelector
      tableId: LegitPosterTableSyndie

- type: entity
  parent: RandomPosterContraband
  id: RandomPosterContrabandSyndie
  name: "random contraband poster spawner (syndie)"
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Structures/Wallmounts/posters.rsi
      state: random_legit
  - type: EntityTableSpawner
    offset: 0
    table: !type:NestedSelector
      tableId: ContrabandPosterTableSyndie

- type: entity
  parent: RandomPosterAny
  id: RandomPosterAnyWallmountable
  name: "random contraband poster spawner (syndie)"
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Structures/Wallmounts/posters.rsi
      state: random_legit
  - type: EntityTableSpawner
    offset: 0
    table: !type:NestedSelector
      tableId: AnyPosterTableSyndie

