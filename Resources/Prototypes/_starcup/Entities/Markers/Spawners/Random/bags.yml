# Spawners

- type: entity
  parent: MarkerBaseStarcup
  id: BackpackSpawner
  name: Random Backpack Spawner
  suffix: Colored
  components:
  - type: Sprite
    layers:
    - state: shadowred
    - state: red
    - sprite: _starcup/Clothing/Back/Backpacks/backpack_colorable.rsi
      state: icon
  - type: EntityTableSpawner
    offset: 0
    table: !type:NestedSelector
      tableId: AllColorableBackpacks

