- type: entity
  name: Mimelet
  parent: MobHamsterHamlet
  id: MobHamsterHamletMime
  description: A grumpy, cute, and soft-spoken hamster.
  components:
  - type: Loadout
    prototypes: [ MobMimeletGear ]
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: petting-success-hamster
    interactFailureString: petting-failure-hamster
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/_starcup/silence.ogg

- type: entity
  parent: MobMonkeyPunpun
  id: MobMonkeyPunpunCold
  components:
  - type: Loadout
    prototypes: [ MobMonkeyGearCold ]

- type: entity
  name: Dishduty
  parent: MobPaperwork
  id: MobDishduty
  description: A former corporate enemy on parole for crimes against the Syndicate. She is just as slow as Paperwork.
  components:
  - type: Sprite
    sprite: _starcup/Mobs/Pets/dishduty.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: dishduty
  - type: DamageStateVisuals
    states:
      Alive:
        Base: dishduty
      Critical:
        Base: dishduty_dead
      Dead:
        Base: dishduty_dead
  - type: Grammar
    attributes:
      proper: true
      gender: female
  - type: InteractionPopup
    successChance: 0.7 # She's a little chillier than Paperwork
    interactSuccessString: petting-success-dishduty
    interactFailureString: petting-failure-sloth
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/sloth_squeak.ogg
    interactFailureSound:
      path: /Audio/Misc/Woosh.ogg

- type: entity
  name: Greenstuff
  parent: MobSnake
  id: MobGreenstuff
  description: An exceptionally lazy, scaly friend with a pliant disposition.
  components:
  - type: Sprite
    sprite: _starcup/Mobs/Pets/greenstuff.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: snake
  - type: DamageStateVisuals
    states:
      Alive:
        Base: snake
      Critical:
        Base: snake_dead
      Dead:
        Base: snake_dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 0.75
    baseSprintSpeed: 1
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _starcup/Mobs/Pets/greenstuff.rsi
    quickEquip: false
    slots:
    - NECK
  - type: InteractionPopup
    successChance: 0.9 # More pliant than the typical snake
    interactSuccessSound:
      path: /Audio/Animals/snake_hiss.ogg
  - type: Tag
    tags:
    - CannotSuicide
    - VimPilot

- type: entity
  name: Henrietta
  parent: MobChicken
  id: MobHenrietta
  description: A bird of regal bearing with exceptionally luxurious down feathers. Refuses to answer to "Henri".
  components:
  - type: Sprite
    sprite: _starcup/Mobs/Pets/henrietta.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: henrietta
  - type: DamageStateVisuals
    states:
      Alive:
        Base: henrietta
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: NpcFactionMember
    factions:
    - BugHunter
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 1
  - type: Reproductive
    breedChance: 0
  - type: TemperatureDamage
    coldDamageThreshold: 250
    coldDamage:
      types:
        Cold: 0.5
  - type: Item
    size: Huge
  - type: Grammar
    attributes:
      proper: true
      gender: female
  - type: InteractionPopup
    successChance: 0.25 # A princess does not permit the commoners to touch her
    interactSuccessString: petting-success-henrietta
    interactFailureString: petting-failure-henrietta
  - type: Puller
    needsHands: false
  - type: Tag
    tags:
    - CannotSuicide
    - VimPilot

- type: entity
  name: Gloom
  parent: MobAdultSlimes
  id: MobGloomPet
  description: A masterpiece that went through thousands of experiments... not all of them ethical. Smile Slime?
  components:
  - type: Sprite
    sprite: _starcup/Mobs/Pets/gloom.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: gloom
  - type: DamageStateVisuals
    states:
      Alive:
        Base: gloom
      Critical:
        Base: blue_adult_slime_dead
      Dead:
        Base: blue_adult_slime_dead
  - type: Butcherable
    spawned:
    - id: FoodMeatSlime
      amount: 2
    - id: MaterialBones
      amount: 3
    dropOrgansOnButcher: true
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSlime
      params:
        volume: -20
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: MeleeWeapon
    damage:
      types:
        Caustic: 3
  - type: SolutionContainerManager
    solutions:
      melee:
        maxVol: 30
  - type: SolutionRegeneration
    solution: melee
    generated:
      reagents:
      - ReagentId: MuteToxin
        Quantity: 1
  - type: MeleeChemicalInjector
    transferAmount: 0.1
    solution: melee
  - type: DamageOnInteract
    damage:
      types:
        Caustic: 0.9
  - type: InteractionPopup
    successChance: 1 # Don't know how to give the damage on interact a chance to fail
    interactSuccessString: petting-success-gloom
    interactSuccessSound:
      path: /Audio/Effects/lightburn.ogg
  - type: Tag
    tags:
    - FootstepSound
    - DoorBumpOpener
    - CannotSuicide
    - VimPilot
