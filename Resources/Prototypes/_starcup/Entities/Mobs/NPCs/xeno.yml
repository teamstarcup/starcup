# RMC organizes their xenos on tiers that they evolve into in order.
# We don't have that mechanic, so for us tiers just represent escalating threat level.

- type: entity
  name: base non-combat exomorph
  id: MobXenoNoCombat
  abstract: true
  parent:
  - BaseSimpleMob
  - MobAtmosExposed
  - MobBloodstream
  - MobFlammable
  description: They mostly come at night. Mostly.
  components:
  - type: Insulated
  - type: CombatMode
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: XenoCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 1.5
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
  - type: NpcFactionMember
    factions:
    - Xeno
  - type: Hands
  - type: ItemOffer
  - type: ComplexInteraction
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 1000
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      70: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      25: 0.5
  - type: Stamina
    critThreshold: 200
  - type: Bloodstream
    bloodReagent: FluorosulfuricAcid
    bloodMaxVolume: 650
  - type: DamageStateVisuals
    states:
      Alive:
        Base: running
      Critical:
        Base: crit
      Dead:
        Base: dead
  - type: Puller
    needsHands: true
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatXeno
      amount: 5
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghost-role-information-xeno-name
    description: ghost-role-information-xeno-description
    rules: ghost-role-information-xeno-rules
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: TypingIndicator
    proto: alien
  - type: Temperature
    heatDamageThreshold: 360
    coldDamageThreshold: -150
    currentTemperature: 310.15
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
    - FootstepSound
    - CreatureEmotes
  - type: NoSlip
  - type: Perishable
    molsPerSecondPerUnitMass: 0.0005
  - type: Speech
    speechVerb: Xeno
    speechSounds: Xeno
    allowedEmotes: [ "Tailwhip", "Drool", "CreatureHiss", "CreatureGrowl", "CreatureRoar", "CreatureScream" ]
  - type: Vocal
    sounds:
      Male: Xeno
      Female: Xeno
      Unsexed: Xeno
  - type: Deathgasp

# Tier 0

- type: entity
  name: larva
  parent: MobXenoNoCombat
  id: MobXenoLarva
  description: Third stage of the exomorph life cycle. Eats its way out of a host.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Mobs/OldXenonids/Larva/larva.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
  - type: MovementSpeedModifier
    baseSprintSpeed: 1
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Dead
  - type: Puller
    needsHands: false
  - type: Speech
    speechVerb: Xeno
    speechSounds: XenoLarva
    allowedEmotes: [ "Tailwhip", "Drool", "CreatureScream" ]
  - type: Vocal
    sounds:
      Male: XenoLarva
      Female: XenoLarva
      Unsexed: XenoLarva

- type: entity
  name: parasite
  parent: MobXeno
  id: MobXenoParasite
  description: Second stage of exomorph life cycle. Crawls out of an egg to impregnate a host with an alien larva.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Mobs/OldXenonids/Parasite/parasite.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
  - type: MobThresholds
    thresholds:
      0: Alive
      10: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      40: 0.7
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    animation: WeaponArcPunch
    attackRate: 0.5
    damage:
      groups:
        Brute: 4
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Critical:
        Base: crit
      Dead:
        Base: dead
  - type: MovementSpeedModifier
    baseSprintSpeed: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 450
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Ammo
    muzzleFlash: null
  - type: JumpAbility
    jumpThrowSpeed: 16
    action: ActionXenoPounce
    canCollide: true
    jumpDistance: 3
    jumpSound:
      path: /Audio/_starcup/Weapons/Xeno/parasitepounce.ogg
  - type: Speech
    speechVerb: Xeno
    speechSounds: XenoParasite
    allowedEmotes: [ "Drool" ]
  - type: Vocal
    sounds:
      Male: XenoParasite
      Female: XenoParasite
      Unsexed: XenoParasite

- type: entity
  name: lesser parasite
  parent: MobXenoParasite
  id: MobXenoParasiteLesser
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Mobs/OldXenonids/Parasite/parasite.rsi
  - type: TimedDespawn
    lifetime: 100

