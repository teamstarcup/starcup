# Tier 2

- type: entity
  name: boiler
  parent: MobXeno
  id: MobXenoBoiler
  description: Heavy ranged exomorph. Spits acid from a distance.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Mobs/OldXenonids/Boiler/boiler.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: alive
    thresholds:
      0: Alive
      120: Dead
  - type: MovementSpeedModifier
    baseSprintSpeed: 3
  - type: SlowOnDamage
    speedModifierThresholds:
      25: 0.7
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.75
  - type: BasicEntityAmmoProvider
    proto: AcidGlob
    capacity: 1
    count: 1
  - type: Gun
    fireRate: 0.75
    useKey: false
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: /Audio/Weapons/Xeno/alien_spitacid.ogg
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Critical:
        Base: crit
      Dead:
        Base: dead
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 235
        mask:
        - MobMask
        layer:
        - MobLayer

- type: entity
  name: carrier
  parent: MobXenoNoCombat
  id: MobXenoCarrier
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Mobs/OldXenonids/Carrier/carrier.rsi
    offset: 0,0.4
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: alive
    - state: para-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: Stamina
    critThreshold: 300
  - type: SlowOnDamage
    speedModifierThresholds:
      50: 0.7
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 400
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Critical:
        Base: crit
      Dead:
        Base: dead
  - type: Gun
    fireRate: 0.66
    selectedMode: SemiAuto
    showExamineText: false
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/_starcup/Weapons/Xeno/parasitepounce.ogg
  - type: RechargeBasicEntityAmmo
    showExamineText: false
    rechargeCooldown: 20
    rechargeSound: null
  - type: BasicEntityAmmoProvider
    proto: MobXenoParasite
    capacity: 4
    count: 4
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
    blackboard:
