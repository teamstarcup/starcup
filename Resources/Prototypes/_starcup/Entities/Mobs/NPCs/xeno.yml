# Tier 1

- type: entity # Burrower. Copied from the original. Has Puller component.
  name: burrower
  parent: MobXeno
  id: MobXenoBurrower
  description: Breacher exomorph. Walls won't stop it. # starcup
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/Xenos/burrower.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: running
  - type: MeleeWeapon # Left as is, in case we want to change it later.
    altDisarm: false
    angle: 0
    soundHit:
      collection: AlienClaw
    animation: WeaponArcSlash # starcup
    damage:
      types:
        Brute: 8 # starcup: big claws
        Structural: 10 # starcup: see above
  - type: MovementSpeedModifier
    baseSprintSpeed: 3
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Dead # armor plates on back, but frailer than a drone
  - type: Puller
    needsHands: false # starcup: allows for creepy ghostrole "dragging away the body" behavior

- type: entity
  name: skulker
  parent: MobXeno
  id: MobXenoSkulker
  description: Common juvenile exomorph. Usually hunts in packs. # starcup
  components:
  - type: Sprite
    sprite: _starcup/Mobs/Aliens/Xenos/skulker.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: running
  - type: SlowOnDamage
    speedModifierThresholds:
      40: 0.7
  - type: MeleeWeapon
    damage:
      groups:
        Brute: 6
  - type: MovementSpeedModifier
    baseSprintSpeed: 4.5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 450
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Puller
    needsHands: false

- type: entity
  name: lesser drone
  parent: MobXeno
  id: MobXenoDroneLesser
  description: Smaller exomorph laborer. Rapidly hatched and expendable. # starcup
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Mobs/OldXenonids/LesserDrone/lesser_drone.rsi
    offset: 0,0.2
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
  - type: MobThresholds
    thresholds:
      0: Alive
      70: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      40: 0.7
  - type: MeleeWeapon
    damage:
      groups:
        Brute: 4
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Critical:
        Base: crit
      Dead:
        Base: dead
  - type: MovementSpeedModifier
    baseSprintSpeed: 4
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 450
        mask:
        - MobMask
        layer:
        - MobLayer

