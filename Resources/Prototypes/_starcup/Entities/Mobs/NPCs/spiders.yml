  - type: NpcFactionMember
    factions:
    - SimpleHostile
    - BugHunter
    - GiantBugHunter
  - type: TimedDespawn
    lifetime: 100

# Spider venmos
- type: entity
  parent: [SolutionWeapon, SolutionTiny]
  id: SolutionVenomSpiderHunter
  categories: [ HideSpawnMenu ]
  components:
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Ebriotoxin
        Quantity: 1

- type: entity
  parent: [SolutionWeapon, SolutionTiny]
  id: SolutionVenomSpiderViper
  categories: [ HideSpawnMenu ]
  components:
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: HeartbreakerToxin
        Quantity: 1
