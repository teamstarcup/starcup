## Giant spiders
- type: entity
  name: black spider
  parent: MobSpiderAngryBase
  id: MobGiantSpiderBlack
  description: A less physically imposing, slightly more poisonous species of giant spider.
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Dead
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: nurse
      sprite: Mobs/Animals/spider.rsi
  - type: SpriteMovement
    movementLayers:
      movement:
        state: nurse-moving
    noMovementLayers:
      movement:
        state: nurse
  - type: DamageStateVisuals
    states:
      Alive:
        Base: nurse
      Critical:
        Base: nurse_dead
      Dead:
        Base: nurse_dead
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Piercing: 5

