## Small spiders
- type: entity
  id: MobSpiderlingBase
  parent:
  - SimpleMobBase
  - BaseMobAnimal
  name: spider
  description: Itsy bitsy in nature.
  abstract: true
  components:
  - type: Sprite
    drawdepth: SmallMobs
    sprite: _starcup/Mobs/Animals/Arachnids/small_spider.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: spider
  - type: DamageStateVisuals
    states:
      Alive:
        Base: spider
      Critical:
        Base: spider_dead
      Dead:
        Base: spider_dead
  - type: Item
    size: Tiny
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MobState
  - type: Extractable
    grindableSolutionName: food
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Slime
          Quantity: 5
  - type: Butcherable
    spawned:
    - id: FoodMeatSlime
  - type: Damageable
    damageModifierSet: Cockroach
  - type: Tag
    tags:
    - Trash
    - VimPilot
    - CreatureEmotes
    - IgnoreTallGrass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 10
      behaviors:
      - !type:GibBehavior
        recursive: false
  - type: StepTrigger
    requiredTriggeredSpeed: 1
  - type: TriggerOnStepTrigger
  - type: RandomChanceTriggerCondition
    successChance: 0.2
  - type: GibOnTrigger
  - type: ProtectedFromStepTriggers
  - type: Speech
    speechVerb: SmallMob
    speechSounds: BeetleSpeechSounds
  - type: Vocal
    emoteSounds: BeetleSpeechEmotes
    emoteAction: ActionCreatureBuzz
  - type: ReplacementAccent
    accent: crab
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: CopperBlood
        Quantity: 5
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 4.0
  - type: MobThresholds
    thresholds:
      0: Alive
      3: Dead
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 1
  - type: Ammo
    muzzleFlash: null
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
    - BugHunter
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NoSlip
  - type: IgnoreSpiderWeb

- type: entity
  id: MobSpiderling
  parent: MobSpiderlingBase

- type: entity
  id: MobSpiderlingBrood
  parent: MobSpiderlingBase
  name: spiderling brood
  description: Voracious children of the midwife spider.
  components:
