- type: entity
  name: vampire sharkminnow
  parent: MobShark
  id: MobSharkVampire
  description: A terrifying shark from the blackness of endless space, with wicked long fangs.
  components:
  - type: Sprite
    sprite: _starcup/Mobs/Aliens/Carps/Sharkminnows/sharkminnowvampire.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: mouth
      shader: unshaded
  - type: MobThresholds
    thresholds:
      0: Alive
      115: Dead
      - type: MeleeWeapon
        damage:
          types:
            Slash: 10
            Bloodloss: 7
  - type: Butcherable
    spawned:
    - id: FoodMeatFish
      amount: 4
    - id: MaterialToothSharkminnow1
      amount: 5

