# Antag
- type: entity
  name: monkey
  id: MobBaseNanotrasenMonkey
  parent: MobBaseSyndicateMonkey
  suffix: NanoTrasen base
  components:
  - type: Loadout
    prototypes: [NanotrasenOperativeGearMonkey]

- type: entity
  id: MobMonkeyNanotrasenAgent
  parent: MobBaseNanotrasenMonkey
  suffix: NanoTrasen agent
  components:
    # make the player a traitor once its taken
  - type: AutoTraitor
    profile: TraitorReinforcement

- type: entity
  id: MobMonkeyNanotrasenAgentNukeops # Reinforcement exclusive to nukeops uplink
  parent: MobBaseNanotrasenMonkey
  suffix: NukeOps, NanoTrasen
  components:
  - type: NukeOperative

- type: entity
  parent: [ BaseTraitorContraband, MobGrenadePenguin ]
  id: MobGrenadePenguinNT
  suffix: NanoTrasen
  description: A small penguin with a grenade strapped around its neck. Harvested by NanoTrasen from icy shit-hole planets.

- type: entity
  name: NanoCat
  id: MobCatNT
  parent: MobCatSyndy
  components:
  - type: Sprite
    sprite: _starcup/Mobs/Pets/cat.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: nanocat
  - type: DamageStateVisuals
    states:
      Alive:
        Base: nanocat
      Critical:
        Base: nanocat_dead
      Dead:
        Base: nanocat_dead
  - type: GhostRole
    prob: 1
    name: ghost-role-information-NanoCat-name
    allowMovement: true
    description: ghost-role-information-SyndiCat-description
    rules: ghost-role-information-SyndiCat-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: default

- type: entity
  name: bird
  suffix: brown
  parent: [ SimpleMobBase, FlyingMobBase, MobCombat ]
  id: MobBirdBrown
  description: The chirper
  components:
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 6
  - type: Sprite
    drawdepth: Mobs
    scale: 0.9, 0.9
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: bird
      sprite: _starcup/Mobs/Animals/Birds/brown_bird.rsi
  - type: Speech
    speechSounds: Cluck
    speechVerb: SmallMob
    allowedEmotes: ['Squeak']
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 10
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: bird
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: Butcherable
    spawned:
    - id: FoodMeatDuck # Replace with FoodMeatBird later
      amount: 1
  - type: InteractionPopup
    successChance: 0.2
    interactSuccessString: petting-success-bird
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/fox_squeak.ogg
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-organic
  - type: Bloodstream
    bloodMaxVolume: 50
  - type: ReplacementAccent
    accent: mouse
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcThrust
    damage:
      types:
        Piercing: 4
  - type: MobThresholds
    thresholds:
      0: Alive
      10: Critical
      20: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 120
      behaviors:
      - !type:GibBehavior
        recursive: false
  - type: Tag
    tags:
    - VimPilot
