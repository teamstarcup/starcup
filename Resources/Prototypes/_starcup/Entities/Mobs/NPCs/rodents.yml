# Rats
# Normal rat is a modified copy of MobMouse.
- type: entity
  name: rat
  parent:
  - SimpleMobBase
  - BaseMobAnimal
  id: MobRat
  description: Slightly bigger and meaner than most mice.
  components:
  - type: Speech
    speechSounds: Squeak
    speechVerb: SmallMob
    allowedEmotes: ['CreatureSqueak', 'CreatureScream', 'CreatureLaugh', 'CreatureYawn', 'CreatureCough']
  - type: Sprite
    drawdepth: SmallMobs
    sprite: _starcup/Mobs/Animals/Rodents/rat.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: rat
  - type: SpriteMovement
    movementLayers:
      movement:
        state: rat-moving
    noMovementLayers:
      movement:
        state: rat
  - type: Item
    size: Tiny
    heldPrefix: 0
  - type: NpcFactionMember
    factions:
    - Mouse
  - type: HTN
    constantlyReplan: false
    rootTask:
      task: MouseCompound
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 30
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MobState
  - type: Deathgasp
  - type: MobStateActions
    actions:
      Critical:
      - ActionCritSuccumb
      - ActionCritFakeDeath
      - ActionCritLastWords
  - type: MobThresholds
    thresholds:
      0: Alive
      20: Critical
      30: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.5
    baseSprintSpeed : 5
  - type: DamageStateVisuals
    states:
      Alive:
        Base: rat
      Critical:
        Base: dead
      Dead:
        Base: splat
  - type: Edible
  - type: FlavorProfile
    flavors:
    - meaty
  - type: Thirst
    startingThirst: 25
    thresholds:
      OverHydrated: 35
      Okay: 25
      Thirsty: 15
      Parched: 5
      Dead: 0
    baseDecayRate: 0.04
  - type: Hunger
    thresholds:
      Overfed: 35
      Okay: 25
      Peckish: 12.5
      Starving: 5
      Dead: 0
    baseDecayRate: 0.05
  - type: Extractable
    grindableSolutionName: food
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 3
  - type: Butcherable
    spawned:
    - id: FoodMeatRat
      amount: 1
  - type: ReplacementAccent
    accent: mouse
  - type: Tag
    tags:
    - Trash
    - VimPilot
    - ChefPilot
    - Mouse
    - Meat
    - CreatureEmotes
    - IgnoreTallGrass
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.25
    damageRecovery:
      types:
        Asphyxiation: -0.25
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.1
  - type: Vocal
    sounds:
      Unsexed: SqueakSpeechEmotes
    screamId: CreatureSqueak
    screamAction: ActionEmitSound
    wilhelmProbability: 0.001
  - type: TypingIndicator
    proto: rodentia
  - type: CombatMode
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 1.2
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 50
  - type: CanEscapeInventory
  - type: BadFood
  - type: NonSpreaderZombie
  - type: FoodSequenceElement
    entries:
      Taco: RatTaco
      Burger: RatBurger
      Skewer: RatSkewer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 60
      behaviors:
      - !type:GibBehavior
        recursive: false
  - type: FelinidFood
  - type: Puller
    needsHands: false

- type: entity
  parent: MobRat
  id: MobRatGray
  suffix: gray
  components:
  - type: Sprite
    sprite: _starcup/Mobs/Animals/Rodents/rat_gray.rsi

