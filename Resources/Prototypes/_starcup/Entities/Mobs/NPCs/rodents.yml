- type: entity
  parent: BaseBullet
  id: RatQuill
  name: bristle rat quill
  categories: [ HideSpawnMenu ]
  components:
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: Sprite
    sprite: _starcup/Mobs/Animals/Rodents/bristle_rat_blue.rsi
    layers:
    - state: bristle
      shader: unshaded
  - type: Ammo
    muzzleFlash: null
  - type: Physics
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.05,-0.05,0.05,0.05"
        hard: false
        mask:
        - Opaque
      fly-by: *flybyfixture
  - type: Projectile
    impactEffect: BulletImpactEffectDisabler
    damage:
      types:
        Piercing: 4
  - type: TimedDespawn
    lifetime: 3

