- type: entity
  id: EffectNonDiegeticBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _starcup/Effects/non-diegetic.rsi
    layers:
    - map: [ "effect" ]
      state: exclamation
      offset: 0,0.3
      shader: unshaded
    drawdepth: Overlays
  - type: TimedDespawn
    lifetime: 0.8
  - type: EmitSoundOnSpawn
    sound:
      collection: WindChime

- type: entity
  id: EffectExclamationMark
  parent: EffectNonDiegeticBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - map: [ "effect" ]
      state: exclamation
      offset: 0,0.3
      shader: unshaded

