- type: entity
  parent: WireBrush
  id: FeatherDuster
  name: feather duster
  description: A soft feather duster, able to remove rust by what we can only describe as maid magic.
  components:
  - type: Sprite
    sprite: _starcup/Objects/Specific/Janitorial/featherduster.rsi
    state: icon
  - type: Item
    storedSprite:
      sprite: _starcup/Objects/Specific/Janitorial/featherduster.rsi
      state: storage
  - type: Tool
    qualities:
    - Brushing
    useSound:
      path: _starcup/Tools/dusting.ogg
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 0
    soundHit:
      collection: ClothSmack

- type: entity
  parent: BaseItem
  name: mop
  id: MopItem
  description: A mop that can't be stopped, viscera cleanup detail awaits.
  components:
  - type: Sprite
    sprite: Objects/Specific/Janitorial/mop.rsi
    layers:
    - state: mop
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: fill-3
      visible: false
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: fill-
    inHandsFillBaseName: -fill-
    inHandsMaxFillLevels: 2
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 10
    soundHit:
      collection: MetalThud
  - type: Spillable
    solution: absorbed
    spillWhenThrown: false
    preventMelee: false
  - type: DrainableSolution
    solution: absorbed
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 5
  - type: Item
    size: Large
    sprite: Objects/Specific/Janitorial/mop.rsi
  - type: Absorbent
    useAbsorberSolution: true
  - type: SolutionContainerManager
    solutions:
      absorbed:
        maxVol: 100
  - type: UseDelay
    delay: 1
  - type: PhysicalComposition
    materialComposition:
      Plastic: 50
  - type: Tag
    tags:
    - Mop
    - MopBasic
  - type: GuideHelp
    guides:
    - Janitorial
  - type: DnaSubstanceTrace
