  - type: Healing
    damageContainers:
    - HumanoidSilicon
    damage:
      types:
        Shock: -10
    healingBeginSound:
      path: "/Audio/Items/Medical/ointment_begin.ogg"
      params:
        volume: 1.0
        variation: 0.125
    healingEndSound:
      path: "/Audio/Items/Medical/ointment_end.ogg"
      params:
