        variation: 0.125
    healingEndSound:
      path: "/Audio/Items/Medical/ointment_end.ogg"
      params:
        volume: 1.0
        variation: 0.125

- type: entity
  id: HydraulicPouch1
  parent: HydraulicPouch
  suffix: Single
