- type: entity
  name: NanoTrasen hypospray
  parent: BaseItem
  description: Using reverse engineered designs from the Syndicate, NanoTrasen produced these in limited quantities for their operatives.
  id: NanotrasenHypo
  components:
  - type: Sprite
    sprite: _starcup/Objects/Specific/Medical/nanohypo.rsi
    layers:
      - state: hypo
        map: ["enum.SolutionContainerLayers.Base"]
      - state: hypo_fill1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: Item
    sprite: _starcup/Objects/Specific/Medical/nanohypo.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 20
  - type: RefillableSolution
    solution: hypospray
  - type: ExaminableSolution
    solution: hypospray
  - type: Hypospray
    onlyAffectsMobs: false
  - type: UseDelay
    delay: 0.5
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: hypo_fill
    solutionName: hypospray

- type: entity
  name: hyperzine injector
  parent: [ChemicalMedipen, BaseNanotrasenContraband]
  id: StimpackNT
  description: Contains enough hyperzine for you to have the chemical's effect for 30 seconds. Use it when you're sure you're ready to throw down.
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#04599a"
      - state: base-colorB-inhand-left
        color: "#2982c6"
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#04599a"
      - state: base-colorB-inhand-right
        color: "#2982c6"
  - type: Sprite
    sprite: _starcup/Objects/Specific/Medical/medipen.rsi
    layers:
    - state: stimpen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 30
        reagents:
        - ReagentId: Stimulants
          Quantity: 30
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: stimpen_empty
  - type: Hypospray
    solutionName: pen
    transferAmount: 30
    onlyAffectsMobs: false
    injectOnly: true
  - type: StaticPrice
    price: 500

- type: entity
  name: hyperzine microinjector
  parent: [ChemicalMedipen, BaseNanotrasenContraband]
  id: StimpackMiniNT
  description: A microinjector of hyperzine that give you about 15 seconds of the chemical's effects.
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#04599a"
      - state: base-colorB-inhand-left
        color: "#2982c6"
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#04599a"
      - state: base-colorB-inhand-right
        color: "#2982c6"
  - type: Sprite
    sprite: _starcup/Objects/Specific/Medical/medipen.rsi
    layers:
    - state: microstimpen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15
        reagents:
        - ReagentId: Stimulants
          Quantity: 15
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: microstimpen_empty
  - type: StaticPrice
    price: 100
