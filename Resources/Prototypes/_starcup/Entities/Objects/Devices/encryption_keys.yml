- type: entity
  parent: [ EncryptionKey, BaseNanotrasenContraband ]
  id: EncryptionKeyNT
  name: blueblood encryption key
  description: An encryption key used by... wait... Who is the owner of this chip?
  components:
  - type: EncryptionKey
    channels:
    - Syndicate
    defaultChannel: Syndicate
  - type: Sprite
    layers:
    - state: crypt_red
    - state: synd_label

- type: entity
  parent: [ EncryptionKey, BaseNanotrasenContraband ]
  id: EncryptionKeyBinaryNanotrasen
  name: binary translator key
  description: A NanoTrasen encryption key that translates binary signals used by silicons.
  components:
  - type: EncryptionKey
    channels:
    - Binary
    defaultChannel: Binary
  - type: Sprite
    layers:
    - state: crypt_red
    - state: ai_label
