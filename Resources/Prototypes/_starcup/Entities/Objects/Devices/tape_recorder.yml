- type: entity
  suffix: Ptarmigan Intro
  parent: CassetteTape
  id: CassetteTapeFilledPtarmigan
  components:
  - type: Label
    currentLabel: Ptarmigan Introductory Recording
  - type: TapeCassette
    recordedData:
    - timestamp: 1
      name: Monotone Voice
      message: "Brought to you by the Electra Dynamics Energy Neocorporation."
    - timestamp: 7
      name: Monotone Voice
      message: "Welcome to the Ptarmigan Outpost. Your outpost is nestled into a small valley on the planet of Yssmoon, a planet seen by many as complex and mysterious because few people know everything about it."
    - timestamp: 12
      name: Monotone Voice
      message: "But there are some basics about the Ptarmigan that are relatively easy to learn. Would you like to learn about how to maintain your Ptarmigan Outpost?"
    - timestamp: 14
      name: Monotone Voice
      message: "Great. Let's get started."
    - timestamp: 17
      name: Monotone Voice
      message: "Part One. General."
    - timestamp: 22
      name: Monotone Voice
      message: "You will notice that the Ptarmigan is very small compared to most space stations, with only one department head other than the Captain: the Quartermaster."
    - timestamp: 27
      name: Monotone Voice
      message: "You will also notice that it is very, very cold outside. It is very important to be careful not to jam the entrance doors, as this will let the cold air in."
    - timestamp: 32
      name: Monotone Voice
      message: "It is also very important not to let pets escape into the cold, including the central Courtyard."
    - timestamp: 37
      name: Monotone Voice
      message: "Most animals cannot survive temperatures of 213 degrees Kelvin for very long."
    - timestamp: 42
      name: Monotone Voice
      message: "Neither can you, of course. Remember to dress warmly."
    - timestamp: 47
      name: Monotone Voice
      message: "Now, while the atmosphere of Yssmoon is very cold, the liquid plasma rivers are very hot. Unprotected crew should avoid going near liquid plasma."
    - timestamp: 52
      name: Monotone Voice
      message: "Did you know that liquid plasma can burn you even without direct skin-to-plasma contact? It can."
    - timestamp: 57
      name: Monotone Voice
      message: "Remember to listen to your commanding officers, and to offer help where needed."
    - timestamp: 62
      name: Monotone Voice
      message: "Be careful going too far from the outpost, especially after dark and especially alone."
    - timestamp: 67
      name: Monotone Voice
      message: "Used clothes can be deposited in the entrance hall laundry chute for cleaning."
    - timestamp: 73
      name: Monotone Voice
      message: "Part Two. Engineering."
    - timestamp: 79
      name: Monotone Voice
      message: "Now there is the role of your Engineering department. Engineering is a very important department."
    - timestamp: 84
      name: Monotone Voice
      message: "As you might imagine, the Electra Dynamics Energy Neocorporation knows a lot about Engineering."
    - timestamp: 89
      name: Monotone Voice
      message: "In Engineering, you are tasked with repairing damage, keeping the atmosphere habitable, and keeping the station powered."
    - timestamp: 95
      name: Monotone Voice
      message: "The Ptarmigan's power supply is particularly reliant on the resources mined by your Logistics department."
    - timestamp: 100
      name: Monotone Voice
      message: "The outpost is powered by a set of long-term basic generators which require minimal upkeep, as well as five P.A.C.M.A.N. generators, which require plasma sheets to generate power for the outpost."
    - timestamp: 105
      name: Monotone Voice
      message: "Do you know what P.A.C.M.A.N. stands for?"
    - timestamp: 110
      name: Monotone Voice
      message: "Great. Then we won't spend any more time on them."
    - timestamp: 115
      name: Monotone Voice
      message: "Note that every substation is equipped with a breaker switch that will shut off all the lights in the department."
    - timestamp: 120
      name: Monotone Voice
      message: "These switches should only be pulled in an emergency or when the crew is leaving the outpost."
    - timestamp: 125
      name: Monotone Voice
      message: "When it comes to construction work, due to terraforming complications, the Ptarmigan's foundations have become slightly unstable."
    - timestamp: 130
      name: Monotone Voice
      message: "This can make the behavior of electronic wiring or replacement floors a little unreliable without special assistance."
    - timestamp: 135
      name: Monotone Voice
      message: "Because Yssmoon was ruled unsuitable for full necrocosmic terraforming, your job as an Atmospheric Technician is very important."
    - timestamp: 140
      name: Monotone Voice
      message: "While Yssmoon's atmosphere is breathable, it frequently reaches temperatures below 220 degrees Kelvin, which is too cold for most species to exist comfortably."
    - timestamp: 145
      name: Monotone Voice
      message: "You will need to optimize your pumps and heating equipment to extract air from the atmosphere, heat it up by about 70 degrees, and pump it into the outpost."
    - timestamp: 150
      name: Monotone Voice
      message: "You might rarely observe bouts of unnaturally warm weather. Some say that this indicates an impending plasma gale. That is false. Plasma gales are not real."
    - timestamp: 155
      name: Monotone Voice
      message: "If you do not think you can manage all of this, you might want to have a few extra space heaters built."
    - timestamp: 160
      name: Monotone Voice
      message: "Part Three. Logistics."
    - timestamp: 165
      name: Monotone Voice
      message: "Now. You are probably thinking, 'with all that hard work Engineering is doing, there will not be any work left for me.'"
    - timestamp: 170
      name: Monotone Voice
      message: "Well, don't worry. There *is* plenty of work left for you."
    - timestamp: 175
      name: Monotone Voice
      message: "The Ptarmigan has a terrestrial trade outpost nearby, maintained by our colleagues at Hawkmoon. Your orders will be deposited there."
    - timestamp: 180
      name: Monotone Voice
      message: "Because it is a long walk, you may wish to contact your Roboticist for an Autonomous Power Loading Unit."
    - timestamp: 185
      name: Monotone Voice
      message: "Salvage Specialists will need to do a lot of mining for plasma to power the outpost."
    - timestamp: 190
      name: Monotone Voice
      message: "Sometimes, shuttle landing areas become cluttered with trees, snow, or even plasma leakage. These are harmless to our high-quality shuttlecraft, but impede foot traffic."
    - timestamp: 195
      name: Monotone Voice
      message: "Salvage should aim to preemptively clear trees and snow from the evacuation landing area whenever possible."
    - timestamp: 200
      name: Monotone Voice
      message: "Plasma appearing to shine through shuttle floors is a complex optical illusion and will not hurt shuttle passengers."
    - timestamp: 205
      name: Monotone Voice
      message: "Finally, should any threats arise, Salvage will need to use their equipment in cooperation with Security to solve the problem."
    - timestamp: 210
      name: Monotone Voice
      message: "Be careful going off alone at night."
    - timestamp: 215
      name: Monotone Voice
      message: "Part Four: Medical."
    - timestamp: 220
      name: Monotone Voice
      message: "The Medical department is always very important on any station, and the Ptarmigan is no different."
    - timestamp: 225
      name: Monotone Voice
      message: "You will often be called upon to help treat injuries sustained from severe cold."
    - timestamp: 230
      name: Monotone Voice
      message: "Leporazine, aloxadone, and arcryox will prove particularly useful chemicals, since they are good for treating severe or even fatal cases of frostbite."
    - timestamp: 235
      name: Monotone Voice
      message: "Your cryonics systems are directly connected to the external atmosphere. This should speed up the cooling process, as it is very cold outside."
    - timestamp: 240
      name: Monotone Voice
      message: "While there is no Psychology office on the outpost, you can feel free to ask your Engineers for help building or repairing one."
    - timestamp: 245
      name: Monotone Voice
      message: "Part Five. Science."
    - timestamp: 250
      name: Monotone Voice
      message: "Did you know that the Ptarmigan was originally built to research the Gloamflower and its reactions to necrocosmic terraforming?"
    - timestamp: 255
      name: Monotone Voice
      message: "Well, anyways, Science is a very important department on the Ptarmigan."
    - timestamp: 260
      name: Monotone Voice
      message: "This outpost has very limited resources, so it is up to you to help construct the machinery that can lead your crew to success."
    - timestamp: 265
      name: Monotone Voice
      message: "The Gloamflower anomaly is an especially stable floraluminiscent-type anomaly. As you might imagine, the Electra Dynamics Energy Neocorporation knows a lot about anomalies."
    - timestamp: 270
      name: Monotone Voice
      message: "This anomaly can be used to generate a steady stream of useful technological data."
    - timestamp: 275
      name: Monotone Voice
      message: "The Gloamflower is particularly resistant to supercritical collapse, and even if destroyed, we have found it will grow back within a few weeks or less."
    - timestamp: 280
      name: Monotone Voice
      message: "Xenoarchaeology is the study of ancient or unknown artifacts. They are considered very mysterious because many people don't fully understand them."
    - timestamp: 285
      name: Monotone Voice
      message: "Although Ptarmigan has recently added an excellent artifact facility, you might need to ask your engineers for help optimizing the atmospheric setup."
    - timestamp: 290
      name: Monotone Voice
      message: "Part Six. Service."
    - timestamp: 295
      name: Monotone Voice
      message: "Keeping the Ptarmigan Outpost clean and comfortable is very important."
    - timestamp: 300
      name: Monotone Voice
      message: "Luckily, the Outpost is very small. Of course, this means you will need to coordinate with other departments to be sure that you have everything you need."
    - timestamp: 305
      name: Monotone Voice
      message: "The Ptarmigan Outpost's dining hall and courtyard will provide the primary hubs for leisure and social interactions."
    - timestamp: 310
      name: Monotone Voice
      message: "Service Workers are expected to help deliver meals, drinks, Botany supplies, and laundry."
    - timestamp: 315
      name: Monotone Voice
      message: "You can use the light switches to allow the crew to admire Yssmoon's beautiful sunrises and sunsets. Wow!"
    - timestamp: 320
      name: Monotone Voice
      message: "Part Seven. Security."
    - timestamp: 325
      name: Monotone Voice
      message: "Yssmoon's remote location and inhospitable environment mean most ordinary threats are unlikely to reach your outpost."
    - timestamp: 330
      name: Monotone Voice
      message: "But there are some threats which do reach your outpost sometimes."
    - timestamp: 335
      name: Monotone Voice
      message: "Dangerous aliens called exomorphs, native to the outer reaches of space, will sometimes collide with Yssmoon."
    - timestamp: 340
      name: Monotone Voice
      message: "Exomorphs do not seem to feel the cold, so you will have to dispose of them yourself."
    - timestamp: 345
      name: Monotone Voice
      message: "Since your Armory is very small, you will want to coordinate with other departments to ensure that the outpost is adequately defended in the event of a potential external threat."
    - timestamp: 350
      name: Monotone Voice
      message: "Due to an unusually high rate of mental health crises and aberrant crew activity, Security's role is expected to be more driven by detective work than on a normal station."
    - timestamp: 355
      name: Monotone Voice
      message: "Part Eight. Command."
    - timestamp: 363
      name: Monotone Voice
      message: "Command is in some ways the most important department, but also the most mysterious, because few people know everything about it."
    - timestamp: 368
      name: Monotone Voice
      message: "On the Ptarmigan Outpost, the Captain, Quartermaster, and Administrative Assistant will have to keep the crew organized and dedicated to a purpose."
    - timestamp: 373
      name: Monotone Voice
      message: "The Ptarmigan was originally built as a prospective necrocosmic outpost, but as the goals of terraforming were set aside, plasma mining and anomalous research have taken priority."
    - timestamp: 378
      name: Monotone Voice
      message: "The Ptarmigan also provides a sort of early alert system."
    - timestamp: 383
      name: Monotone Voice
      message: "Hostile incursions upon Yssmoon could threaten other properties such as Glacier Station. As the Ptarmigan is likely to be attacked first, you will be in an ideal position to dispatch a warning."
    - timestamp: 388
      name: Monotone Voice
      message: "You might think of yourself as a 'ptarmigan in the plasma mine'."
    - timestamp: 391
      name: Monotone Voice
      message: "Upon evacuation, you should ensure that all crew leave for the shuttle in an orderly fashion. The shuttle is located to the southwest of the station."
    - timestamp: 396
      name: Monotone Voice
      message: "In the event of a total whiteout blizzard, you will want to make sure crew can tell where to go."
    - timestamp: 401
      name: Monotone Voice
      message: "Taking cold-vulnerable animals to the evacuation shuttle should be avoided when possible unless Medical is prepared to treat their potential frostbite."
    - timestamp: 406
      name: Monotone Voice
      message: "Finally, due to atmospheric interference, digital clocks do not function properly on Yssmoon. Try to avoid anyone being left behind."
    - timestamp: 411
      name: Monotone Voice
      message: "We hope that you are excited to start your Yssmoon adventure."
