- type: entity
  name: suspicious toolbox
  parent: [ToolboxBase, BaseNanotrasenContraband]
  id: ToolboxNanotrasen
  description: A sinister looking toolbox filled with elite NanoTrasen tools.
  components:
  - type: Sprite
    sprite: _starcup/Objects/Tools/Toolboxes/toolbox_nt.rsi
    state: icon
  - type: Item
    sprite: _starcup/Objects/Tools/Toolboxes/toolbox_nt.rsi
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,7,3
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 20

- type: entity
  name: electrical toolbox
  suffix: NanoTrasen, Turret
  parent: ToolboxElectrical
  id: ToolboxElectricalTurretNT
  description: A toolbox typically stocked with electrical gear.
  components:
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 1
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:SpawnEntitiesBehavior
            spawn:
              WeaponTurretNanotrasenDisposableAntag:
                min: 1
                max: 1
  - type: StaticPrice
    price: 1350
