# Based on EE's/Den's original, but without medical functionality.
- type: entity
  name: pen light
  parent: Pen
  id: PenLightToy
  description: A pen with a small flashlight, for writing in the dark.
  components:
  - type: HandheldLight
    addPrefix: false
  - type: Sprite
    sprite: _EE/Objects/Tools/penlight.rsi
    layers:
    - state: world
    - state: world-on
      shader: unshaded
      visible: false
      map: [ "light" ]
  - type: Item
    sprite: Objects/Tools/penlight.rsi
    heldPrefix: off
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 2
    netsync: false
  - type: Appearance
  - type: ItemTogglePointLight
  - type: ToggleableVisuals
    spriteLayer: light
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot {}
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmall
  - type: Tag
    tags:
    - Flashlight
    - Write
    - Pen
