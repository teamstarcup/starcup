- type: entity
  name: wrench
  suffix: variant
  parent: Wrench
  id: WrenchVariantA
  components:
  - type: Sprite
    sprite: _starcup/Objects/Tools/wrench.rsi
    state: icon
  - type: Item
    sprite: _starcup/Objects/Tools/wrench.rsi
    storedSprite:
      sprite: _starcup/Objects/Tools/wrench.rsi
      state: storage

- type: entity
  name: wrench
  suffix: variant
  parent: Wrench
  id: WrenchVariantB
  components:
  - type: Sprite
    sprite: _starcup/Objects/Tools/monkey_wrench.rsi
    state: icon
  - type: Item
    sprite: _starcup/Objects/Tools/monkey_wrench.rsi
    storedSprite:
