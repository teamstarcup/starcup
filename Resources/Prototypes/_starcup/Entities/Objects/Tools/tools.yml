- type: entity
  name: heavy wrench
  parent: Wrench
  id: HeavyWrench
  description: 'Heavier but slower on the swing than a common wrench. Remember: lefty latchy, righty removey.'
  components:
  - type: Sprite
    sprite: _starcup/Objects/Tools/heavy_wrench.rsi
    state: icon
  - type: Item
    sprite: _starcup/Objects/Tools/heavy_wrench.rsi
    storedSprite:
      sprite: _starcup/Objects/Tools/heavy_wrench.rsi
      state: storage
  - type: MeleeWeapon
    wideAnimationRotation: 135
    attackRate: 1
    damage:
      types:
        Blunt: 5

