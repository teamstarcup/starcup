# Templates for parenting
- type: entity
  parent: BaseItem
  id: FlagCarriedBase
  name: flag
  suffix: Carried
  abstract: true
  description: An unhanged flag. You could probably wear it on your back like a cape.
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/flags.rsi
    noRot: true
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-both
      right:
      - state: inhand-both
    size: Ginormous
  - type: Clothing
    quickEquip: true
    slots:
    - neck
  - type: StaticPrice
    price: 25
  - type: NFWallmountable
    soundFinished:
      collection: storageRustle
      params:
        variation: 0.125

- type: entity
  parent: FlagCarriedBase
  id: FlagCarriedBaseDV
  components:
  - type: Sprite
    sprite: _DV/Structures/Wallmounts/flags.rsi
  - type: NFWallmountable
    spawn: TransRoyalShrimpFlag # literally only here so it doesn't throw an error

