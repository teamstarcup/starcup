- type: entity
  parent: BasePlushie
  id: PlushieEskie
  name: eskie plushie
  description: A highly marketable stuffed toy resembling a famous cartoon character. There's a tag on it that reads "100% polycotton."
  components:
  - type: Sprite
    sprite: _starcup/Objects/Fun/plushies.rsi
    state: eskie
  - type: FoodSequenceElement
    entries:
      CottonBurger: EskiePlushie

- type: entity
  parent: BasePlushie
  id: PlushieEikse
  name: eikse plushie
  description: An unmarketable stuffed toy resembling a famous cartoon villain. There's a tag on it that reads "0% polycotton."
  components:
  - type: Sprite
    sprite: _starcup/Objects/Fun/plushies.rsi
    state: eikse
  - type: FoodSequenceElement
    entries:
      CottonBurger: EiksePlushie

- type: entity
  parent: PlushieNuke
  id: PlushieNukeNT
  suffix: NanoTrasen
  description: A stuffed toy that resembles a NanoTrasen nuclear operative. The tag claims operatives to be purely fictitious.
  components:
  - type: Sprite
    sprite: _starcup/Objects/Fun/Plushies/nukie_nt.rsi
    state: icon
  - type: Clothing
    quickEquip: false
    sprite: _starcup/Objects/Fun/Plushies/nukie_nt.rsi
    slots:
    - HEAD
    clothingVisuals:
      head:
      - state: equipped-HELMET
        offset: "0, 0.03"

- type: entity
  parent: BasePlushie
  id: PlushieZetan
  name: zetan plushie
  description: A little alien from out or space. The tag is in an unfamiliar language.
  components:
  - type: Sprite
    sprite: _starcup/Objects/Fun/Plushies/zetan.rsi
    state: icon
  - type: EmitSoundOnUse
    sound: &PlushieZetanSound
      path: /Audio/Weapons/Guns/Gunshots/laser3.ogg
      params:
        volume: -8
  - type: EmitSoundOnLand
    sound: *PlushieZetanSound
  - type: EmitSoundOnActivate
    sound: *PlushieZetanSound
  - type: EmitSoundOnTrigger
    sound: *PlushieZetanSound
  - type: EmitSoundOnCollide
    sound: *PlushieZetanSound
  - type: Edible
    useSound: *PlushieZetanSound
  - type: MeleeWeapon
    soundHit: *PlushieZetanSound
  - type: Clothing
    quickEquip: false
    sprite: _starcup/Objects/Fun/Plushies/zetan.rsi
    slots:
    - HEAD
    clothingVisuals:
      head:
      - state: equipped-HELMET
        offset: "0, 0.03"

# TEDDY BEARS

- type: entity
  parent: PlushieTeddyBearBase
  id: PlushieTeddyBearRecolorableLilac
  name: teddy bear
  suffix: Lilac
  components:
  - type: Sprite
    sprite: _DEN/Objects/Fun/teddybear.rsi
    state: teddybear
    layers:
    - state: teddybear_base
      color: "#d5c6e3"
      map: [ "base" ]
    - state: teddybear_accent
      map: [ "accent" ]
    - state: teddybear_ribbon
      map: [ "ribbon" ]
      visible: false
  - type: Item
    inhandVisuals: # TODO: get itemmapper inhands to work
      left:
      - state: teddybear_base-inhand-left
        color: "#d5c6e3"
        map: [ "base" ]
      - state: teddybear_accent-inhand-left
        map: [ "accent" ]
      # - state: teddybear_ribbon-inhand-left
      #   map: [ "ribbon" ]
      right:
      - state: teddybear_base-inhand-right
        color: "#d5c6e3"
        map: [ "base" ]
      - state: teddybear_accent-inhand-right
        map: [ "accent" ]
      # - state: teddybear_ribbon-inhand-right
      #   map: [ "ribbon" ]

