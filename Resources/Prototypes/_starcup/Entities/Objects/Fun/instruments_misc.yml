- type: entity
  parent: PhoneInstrument
  id: PhoneInstrumentNanotrasen
  name: blueblood phone
  description: For evil people to call their friends.
  components:
  - type: Sprite
    sprite: _starcup/Objects/Fun/Instruments/blueblood_phone.rsi
    state: icon
  - type: Prayable
    sentMessage: prayer-popup-notify-nanotrasen-sent
    notificationPrefix: prayer-chat-notify-nanotrasen

- type: entity
  id: MicrophoneStandInstrument
  parent: BasePlaceableInstrumentRotatable
  name: microphone on stand
  suffix: Large Instrument # starcup
  description: Perfect for singing your heart out. You can't get it out of the stand though.
  components:
  - type: Instrument
    program: 52
  - type: SwappableInstrument
    instrumentList:
      "Aah": { 52: 0 }
      "Ooh": { 53: 0 }
      "Kweh": { 4: 100 } # Defined in space-station-14.sf2
      "Waa": { 5: 100 } # Defined in space-station-14.sf2
      "Wah": { 6: 100 } # Defined in space-station-14.sf2
  - type: Sprite
    sprite: _DEN/Objects/Fun/Instruments/microphone_stand.rsi
    state: microphone-on-stand
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.15
        density: 80
        mask:
        - Impassable
        - MidImpassable
        layer:
        - Opaque
        - MidImpassable
        - BulletImpassable
