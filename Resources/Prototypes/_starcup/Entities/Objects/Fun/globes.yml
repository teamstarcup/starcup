- type: entity
  parent: BaseStructure
  id: BaseGlobe
  name: globe
  description: Probably not life-sized.
  abstract: true
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
    mask:
      - HighImpassable
  - type: Sprite
    drawdepth: LargeObjects
    sprite: _starcup/Objects/Fun/globes.rsi
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
  - type: Pullable
  - type: StaticPrice
    price: 75

- type: entity
  parent: BaseGlobe
  id: ToyGlobeAncientEarth
  name: ancient globe
#  description: #TODO
  components:
  - type: Sprite
    state: earth

- type: entity
  parent: BaseGlobe
  id: ToyGlobeLavaland
  name: lavaland globe
#  description: #TODO
  components:
  - type: Sprite
    state: lavaland

- type: entity
  parent: BaseGlobe
  id: ToyGlobeYssmoon
  name: yssmoon globe
#  description: #TODO
  components:
  - type: Sprite
    state: yssmoon

# not sure if I should use generic colorless sprites to be fancy or what, for now we're doing this
