- type: entity
  name: chopping axe
  parent: [BaseItem, BaseExaminableClothing] # starcup: examinable clothing
  id: ChoppingAxe
  description: An axe for chopping down trees. On a space station. ...yeah.
  components:
  - type: Sharp
  - type: Execution
    doAfterDuration: 4.0
  - type: Sprite
    sprite: _starcup/Objects/Weapons/Melee/chopping_axe.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    damage:
      types:
        Blunt: 2
        Slash: 5
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 4
  - type: Item
    size: Large
  - type: Clothing
    sprite: _starcup/Objects/Weapons/Melee/chopping_axe.rsi
    quickEquip: false
    slots:
    - back
  - type: Tool
    qualities:
    - Axing
  - type: ToolTileCompatible
  - type: UseDelay
    delay: 1

- type: entity
  name: power axe
  parent: ChoppingAxe
  id: PowerAxe
  description: A now illegal Electra Dynamics model, used by combat engineers in the Neocorporate wars. Don't let the blade get close to your face!
  components:
  - type: Sharp
  - type: Execution
    doAfterDuration: 4.0
  - type: Sprite
    sprite: _starcup/Objects/Weapons/Melee/power_axe.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    damage:
      types:
        Blunt: 5
        Slash: 15
        Structural: 15
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 10
        Structural: 10
