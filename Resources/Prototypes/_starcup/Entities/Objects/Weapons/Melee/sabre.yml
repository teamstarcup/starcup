- type: entity
  name: dueling sabre
  parent: BaseItem
  id: FencingSabrePlain
  description:
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Melee/shinai.rsi
    state: icon
  - type: StaminaDamageOnHit
    damage: 10 # TODO
  - type: MeleeWeapon
    attackRate: 1 # average 15 stamina per second
    range: 1 #TODO; weaker range and bad speed but can be swung
    bluntStaminaDamageFactor: 2 # 10 + (5 modified by armor/resistances)
    damage:
      types:
        Blunt: 2.5
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg #TODO
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/eblade1.ogg
      params:
        variation: 0.250
    activatedSoundOnSwing:
      path: /Audio/Weapons/eblademiss.ogg
      params:
        variation: 0.125
  - type: Reflect
    reflectProb: 0.05 # half that of captain's saber
    spread: 90
  - type: Item
    sprite: _starcup/Objects/Weapons/Melee/dueling_sabre.rsi
    storedSprite:
      state: storage
      sprite: _starcup/Objects/Weapons/Melee/dueling_sabre_storage_64x.rsi
    shape:
    - 0,0,0,3
  - type: Tag
    tags:
    - Sabre
    swingBeverage: true
  - type: DisarmMalus # -30% chance--barehanded disarms are silly

- type: entity
  name: dueling sabre
  parent: FencingDuelingSabrePlain
  id: FencingDuelingSabreQuartz
  description:
  components:
  - type: Sprite
    sprite: _starcup/Objects/Weapons/Melee/dueling_sabre_quartz.rsi
