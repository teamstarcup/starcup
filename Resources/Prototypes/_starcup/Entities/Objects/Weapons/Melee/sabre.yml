- type: entity
  name: fencing foil
  parent: BaseItem
  id: FencingFoil
  description: #TODO
  components:
  - type: Sprite
    sprite: _starcup/Objects/Weapons/Melee/foil.rsi
    state: icon
  - type: Item
    sprite: _starcup/Objects/Weapons/Melee/foil.rsi
    storedSprite:
      state: storage
      sprite: _starcup/Objects/Weapons/Melee/foil_storage_64x.rsi
  - type: StaminaDamageOnHit
    damage: 10 #TODO
  - type: MeleeWeapon
    attackRate: 1.5 # average 22.5 stamina per second (over boxing gloves 12 per second)
    range: 1.25 # better range than gloves/saber
    wideAnimationRotation: -135
    bluntStaminaDamageFactor: 2 # 10 + (5 modified by armor/resistances)
    damage:
      types:
        Blunt: 2.5
    altDisarm: true # can't alt-strike, but can try to disarm
    angle: 0
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg #TODO
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/eblade1.ogg
      params:
        variation: 0.250
    activatedSoundOnSwing:
      path: /Audio/Weapons/eblademiss.ogg
      params:
        variation: 0.125
    swingBeverage: true # maybe?
  - type: DisarmMalus #TODO

- type: entity
  name: fencing epee
  parent: BaseItem
  id: FencingSabreEpee
  description: #TODO
  components:
  - type: Sprite
    sprite: _starcup/Objects/Weapons/Melee/epee.rsi
    state: icon
  - type: Item
    sprite: _starcup/Objects/Weapons/Melee/epee.rsi
    storedSprite:
      state: storage
      sprite: _starcup/Objects/Weapons/Melee/epee_storage_64x.rsi
  - type: StaminaDamageOnHit
    damage: 8 # ineffectual on a wideswing
  - type: MeleeWeapon
    attackRate: 0.75 # average 15 per second (or 7.5 with wideswing)
    range: 1.75 # spear-level range, but has to be precise
    wideAnimationRotation: -135
    bluntStaminaDamageFactor: 4 # 8 + (12 modified by armor/resistances)
    angle: 0
    animation: WeaponArcThrust
    damage:
      types:
        Blunt: 0.5 # basically nothing on a wideswing
    clickDamageModifier: 6 # ups it to 3
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg #TODO
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/eblade1.ogg
      params:
        variation: 0.250
    activatedSoundOnSwing:
      path: /Audio/Weapons/eblademiss.ogg
      params:
        variation: 0.125
    swingBeverage: true # maybe?
  - type: DisarmMalus

## AltDisarm = true/false - Does this entity do a disarm on alt attack.
# ResetOnHandSelected = true/false - Starts attack cooldown when equipped if true.
## BluntStaminaDamageFactor - take stamina damage equal to bluntDamage * this (affected by armors/resistances)
## ClickDamageModifier - Multiplies damage by this amount for single-target attacks.
## SwingBeverage - Allows each attack to take turns being either left or right.
