- type: entity
  name: crash axe
  parent: BaseItem
  id: CrashAxe
  description: A serviceable blade with a prying tip.
  components:
  - type: Sharp
  - type: Sprite
    sprite: _starcup/Objects/Weapons/Melee/crash_axe.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    damage:
      types:
        Slash: 7
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    sprite: _starcup/Objects/Weapons/Melee/crash_axe.rsi
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: Tool
    qualities:
    - Prying
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: ToolTileCompatible
    delay: 1.5 # slower than an actual crowbar
  - type: Prying
