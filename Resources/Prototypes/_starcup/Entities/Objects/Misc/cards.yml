- type: entity
  parent: BaseItem
  id: CardBaseSparot
  name: card
  categories: [ HideSpawnMenu ]
  components:
  - type: EmitSoundOnLand
    sound:
      collection: cardShove
  - type: Sprite
    sprite: _EstacaoPirata/Objects/Misc/cards.rsi # TODO
    state: singlecard_down_sparot # TODO
  - type: Rotatable
  - type: Item
    size: Tiny
  - type: UseDelay
    delay: 0.5
  - type: Card
    backSprite:
    - sprite: _EstacaoPirata/Objects/Misc/cards.rsi # TODO
      state: singlecard_down_sparot # TODO
    flipped: true

