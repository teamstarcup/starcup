- type: entity
  parent: CardBoxBase
  id: CardBoxSparot
  name: tarot deck box
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _EstacaoPirata/Objects/Misc/cards.rsi # TODO
    state: box
    layers:
    - state: copper_box # TODO
    - state: copper_box_open # TODO
      map: [ "openLayer" ]
      visible: false
  - type: OpenTriggeredStorageFill
    contents:
    - id: CardDeckSparot
      amount: 1

