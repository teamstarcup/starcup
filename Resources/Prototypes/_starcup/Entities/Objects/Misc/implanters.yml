- type: entity
  id: BaseImplantOnlyImplanterNT
  parent: [BaseImplantOnlyImplanter, BaseNanotrasenContraband]
  name: NanoTrasen implanter
  description: A compact disposable syringe exclusively designed for the injection of subdermal implants. Make sure to scrub it with soap or a rag to remove residual DNA after use!
  abstract: true
  components:
    - type: Item
      sprite: _starcup/Objects/Specific/Medical/nano_implanter.rsi
      heldPrefix: implanter
    - type: Sprite
      sprite: _starcup/Objects/Specific/Medical/nano_implanter.rsi
      state: implanter1
      layers:
        - state: implanter0
          map: [ "implantFull" ]
          visible: true
        - state: implanter1
          map: [ "implantOnly" ]
    - type: GenericVisualizer
      visuals:
        enum.ImplanterVisuals.Full:
          implantFull:
            True: {visible: true}
            False: {visible: false}
        enum.ImplanterImplantOnlyVisuals.ImplantOnly:
          implantOnly:
            True: {state: broken}
            False: {state: implanter1}
    - type: Tag
      tags: []

