# Fillet
- type: entity
  name: raw abyssal carp fillet
  parent: FoodMeatFish
  id: FoodMeatAbyssalFish
  description: Darker, richer... with an oddly enticing color.
  components:
  - type: FlavorProfile
    flavors:
      - bitter
      - salty
  - type: Sprite
    sprite: _starcup/Objects/Consumable/Food/meat.rsi
    state: abyssalfish
  - type: Solution
    solution:
      reagents:
      - ReagentId: CarpoToxin
        Quantity: 8
      - ReagentId: UncookedAnimalProteins
        Quantity: 20
      - ReagentId: Fat
        Quantity: 2 # leaner
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: CarpoToxin
        Quantity: 8
  - type: Item
    inhandVisuals:
      left:
      - state: abyssal-inhand-left
      right:
      - state: abyssal-inhand-right

- type: entity
  name: raw bad carp fillet
  parent: [ SolutionVeryTiny, FoodMeatFish ] # much leaner
  id: FoodMeatBadFish
  description: Pale, dry, and musty.
  components:
  - type: FlavorProfile
    flavors:
    - bitter
    - salty
  - type: Sprite
    sprite: _starcup/Objects/Consumable/Food/meat.rsi
    state: badfish
  - type: Solution
    solution:
      reagents:
      - ReagentId: CarpoToxin
        Quantity: 2
      - ReagentId: UncookedAnimalProteins
        Quantity: 5
      - ReagentId: Fat
        Quantity: 1
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: CarpoToxin
        Quantity: 2
  - type: Item
    inhandVisuals:
      left:
      - state: bad-pink-inhand-left
      right:
      - state: bad-pink-inhand-right

# Red meat
- type: entity
  name: raw capybara meat
  parent: [ FoodMeatRawBase, BaseSlicingRefinable ]
  id: FoodMeatCapybara
  description: A slab of raw capybara meat.
  components:
  - type: Sprite
    state: plain
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatCapybaraCutlet
      amount: 3
  - type: Construction
    graph: CapybaraSteak
    node: start
    defaultTarget: cooked capybara

- type: entity
  name: cooked capybara
  parent: [ FoodMeatBase, BaseSlicingRefinable ]
  id: FoodMeatCapybaraCooked
  description: A cooked slab of capybara meat.
  components:
  - type: Tag
    tags:
    - Cooked
    - Meat
    - Steak
  - type: Sprite
    layers:
    - state: plain-cooked
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatCapybaraCutlet
      amount: 3
  - type: Construction
    graph: CapybaraSteak
    node: cooked capybara

- type: entity
  name: capybara cutlet
  parent: FoodMeatCutletCookedBase
  id: FoodMeatCapybaraCutlet
  description: A cutlet of cooked capybara meat.
  components:
  - type: Tag
    tags:
    - Cooked
    - Cutlet
    - Meat
  - type: Sprite
    state: cutlet-cooked
