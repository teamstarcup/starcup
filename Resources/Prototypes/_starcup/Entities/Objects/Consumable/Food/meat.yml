# Fillet
- type: entity
  name: raw abyssal carp fillet
  parent: FoodMeatFish
  id: FoodMeatAbyssalFish
  description: Darker, richer... with an oddly enticing color.
  components:
  - type: FlavorProfile
    flavors:
      - bitter
      - salty
  - type: Sprite
    sprite: _starcup/Objects/Consumable/Food/meat.rsi
    state: abyssalfish
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: CarpoToxin
          Quantity: 8
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: CarpoToxin
        Quantity: 8
  - type: Item
    inhandVisuals:
      left:
      - state: abyssal-inhand-left
      right:
      - state: abyssal-inhand-right

- type: entity
  name: raw bad carp fillet
  parent: FoodMeatFish
  id: FoodMeatBadFish
  description: Pale, dry, and musty.
  components:
  - type: FlavorProfile
    flavors:
    - bland
    - salty
  - type: Sprite
    sprite: _starcup/Objects/Consumable/Food/meat.rsi
    state: badfish
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: CarpoToxin
          Quantity: 2
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: CarpoToxin
        Quantity: 2
  - type: Item
    inhandVisuals:
      left:
      - state: bad-pink-inhand-left
      right:
      - state: bad-pink-inhand-right

# Red meat
- type: entity
  name: raw capybara meat
  parent: FoodMeatRawBase
  id: FoodMeatCapybara
  description: A slab of raw capybara meat.
  components:
  - type: Sprite
    state: plain
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 9
        - ReagentId: Fat
          Quantity: 9
  - type: SliceableFood
    count: 3
    slice: FoodMeatCapybaraCutlet
  - type: Construction
    graph: CapybaraSteak
    node: start
    defaultTarget: cooked capybara

- type: entity
  name: raw capybara cutlet
  parent: FoodMeatBase
  id: FoodMeatCapybaraCutlet
  description: A cutlet of raw capybara meat.
  components:
  - type: Tag
    tags:
    - Raw
    - Cutlet
    - Meat
  - type: Sprite
    state: cutlet
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 3
        - ReagentId: Fat
          Quantity: 2
  - type: Construction
    graph: CapybaraCutlet
    node: start
    defaultTarget: capybara cutlet

- type: entity
  name: cooked capybara
  parent: FoodMeatBase
  id: FoodMeatCapybaraCooked
  description: A cooked slab of capybara meat. You’re sad when you see this.
  components:
  - type: Tag
    tags:
    - Cooked
    - Meat
    - Steak
  - type: Sprite
    layers:
    - state: plain-cooked
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Protein
          Quantity: 5
  - type: SliceableFood
    count: 3
    slice: FoodMeatCapybaraCutletCooked
  - type: Construction
    graph: CapybaraSteak
    node: cooked capybara

- type: entity
  name: capybara cutlet
  parent: FoodMeatBase
  id: FoodMeatCapybaraCutletCooked
  description: A cutlet of cooked capybara meat.
  components:
  - type: Tag
    tags:
    - Cooked
    - Cutlet
    - Meat
  - type: Sprite
    state: cutlet-cooked
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 2
        - ReagentId: Protein
          Quantity: 2
  - type: Construction
    graph: CapybaraCutlet
    node: capybara cutlet
