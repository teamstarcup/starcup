# speech sounds
- type: speechSounds
  id: BatSpeechSounds
  saySound:
    collection: BatSqueaks
  askSound:
    path: /Audio/_starcup/Animals/Bat/bat_question.ogg
  exclaimSound:
    path: /Audio/_starcup/Animals/Bat/bat_exclamation.ogg

- type: speechSounds
  id: MothSpeechSounds
  saySound:
    collection: MothSpeech
  askSound:
    path: /Audio/_starcup/Voice/Moth/moth_question.ogg
  exclaimSound:
    path: /Audio/_starcup/Voice/Moth/moth_exclamation.ogg

- type: speechSounds
  id: DuckSpeechSounds
  saySound:
    collection: DuckQuacks
  askSound:
    collection: DuckQuacks
  exclaimSound:
    path: /Audio/_starcup/Animals/Duck/duck_quack_exclamation.ogg

- type: speechSounds
  id: LeechSpeechSounds
  saySound:
    collection: LeechSpeech
  askSound:
    path: /Audio/_starcup/Animals/CharonicLeech/leech_question.ogg
  exclaimSound:
    path: /Audio/_starcup/Animals/CharonicLeech/leech_exclaim.ogg

# speech sound emotes

- type: emoteSounds
  id: BatSpeechEmotes
  params:
    variation: 0.125
  sounds:
    CreatureSqueak:
      path: /Audio/_starcup/Animals/Bat/bat_squeak.ogg
    CreatureSneeze:
      collection: MouseSneezes
    CreatureCough:
      collection: MouseSneezes
    CreatureScream:
      path: /Audio/_starcup/Animals/Bat/bat_scream.ogg
    Yawn:
      collection: /Audio/_starcup/Animals/Mouse/mouse_yawn.ogg
    Gasp:
      collection: MouseGasp
    DefaultDeathgasp:
      path: /Audio/_starcup/Animals/Bat/bat_scream.ogg

- type: emoteSounds
  id: SqueakSpeechEmotes
  params:
    variation: 0.125
  sounds:
    CreatureScream:
      path: /Audio/_starcup/Animals/Mouse/mouse_scream.ogg
    CreatureLaugh:
      collection: MouseLaugh
    Sneeze:
      collection: MouseSneezes
    Cough:
      collection: MouseSneezes
    Yawn:
      collection: /Audio/_starcup/Animals/Mouse/mouse_yawn.ogg
    CreatureSqueak:
      path: /Audio/Animals/mouse_squeak.ogg
    Gasp:
      collection: MouseGasp
    DefaultDeathgasp:
      path: /Audio/_starcup/Animals/Mouse/mouse_death.ogg

- type: emoteSounds
  id: CluckSpeechEmotes
  params:
    variation: 0.125
  sounds:
    CreatureScream:
      path: /Audio/_starcup/Animals/Chicken/chicken_scream.ogg
    Crow:
      path: /Audio/_starcup/Animals/Chicken/rooster_crow.ogg
    Ruffle:
      collection: WingRuffle
    DefaultDeathgasp:
      path: /Audio/_starcup/Animals/Chicken/chicken_scream.ogg

- type: emoteSounds
  id: MothroachSpeechEmotes
  params:
    variation: 0.125
  sounds:
    CreatureScream:
      path: /Audio/Voice/Moth/moth_scream.ogg
    CreatureLaugh:
      path: /Audio/Voice/Moth/moth_laugh.ogg
    CreatureChitter:
      path: /Audio/Voice/Moth/moth_chitter.ogg
    CreatureSqueak:
      path: /Audio/Voice/Moth/moth_squeak.ogg
    DefaultDeathgasp:
      collection: MothDeathGasp

- type: emoteSounds
  id: DuckSpeechEmotes
  params:
    variation: 0.125
  sounds:
    CreatureScream:
      collection: DuckScreams
    CreatureLaugh:
      path: /Audio/_starcup/Animals/Duck/duck_laugh.ogg
    Ruffle:
      collection: WingRuffle
    DefaultDeathgasp:
      collection: DuckScreams

- type: emoteSounds
  id: LeechSpeechEmotes
  params:
    variation: 0.125
  sounds:
    CreatureScream:
      path: /Audio/_starcup/Animals/CharonicLeech/leech_scream.ogg
    CreatureGrowl:
      path: /Audio/_starcup/Animals/CharonicLeech/leech_growl.ogg
    DefaultDeathgasp:
      path: /Audio/_starcup/Animals/CharonicLeech/leech_death.ogg
