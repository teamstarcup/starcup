# speech sound emotes

- type: emoteSounds
  id: BatSpeechEmotes
  params:
    variation: 0.125
  sounds:
    CreatureSqueak:
      path: /Audio/_starcup/Animals/Bat/bat_squeak.ogg
    CreatureSneeze:
      collection: MouseSneezes
    CreatureCough:
      collection: MouseSneezes
    CreatureScream:
      path: /Audio/_starcup/Animals/Bat/bat_scream.ogg
    Yawn:
      collection: /Audio/_starcup/Animals/Mouse/mouse_yawn.ogg
    Gasp:
      collection: MouseGasp
    DefaultDeathgasp:
      path: /Audio/_starcup/Animals/Bat/bat_scream.ogg

- type: emoteSounds
  id: SqueakSpeechEmotes
