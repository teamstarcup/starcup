# speech sound emotes

- type: emoteSounds
  id: BatSpeechEmotes
  params:
    variation: 0.125
  sounds:
    CreatureSqueak:
      path: /Audio/_starcup/Animals/Bat/bat_squeak.ogg
    CreatureScream:
      path: /Audio/_starcup/Animals/Bat/bat_scream.ogg
    Yawn:
      collection: /Audio/_starcup/Animals/Mouse/mouse_yawn.ogg
    Sneeze:
      collection: MouseSneezes
    Gasp:
      collection: MouseGasp
