- type: constructionGraph
  id: SpearHarpoon
  start: start
  graph:
    - node: start
      edges:
        - to: spearharpoon
          completed:
          - !type:AdminLog # Needs a log for start of attempt in addition to the completion log
            message: "Construction"
            impact: High
          steps:
            - material: MetalRod
              amount: 2
              doAfter: 2
            - material: Cable
              amount: 3
              doAfter: 1
            - tag: GlassShard
              name: construction-graph-tag-glass-shard
              icon:
                sprite: Objects/Materials/Shards/shard.rsi
                state: shard1
              doAfter: 1
    - node: spearharpoon
      entity: SpearHarpoon

