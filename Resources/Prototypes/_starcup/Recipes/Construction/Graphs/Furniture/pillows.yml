- type: constructionGraph
  id: Pillow
  start: start
  graph:
  - node: start
    edges:
      - to: pillowbaseunwrapped
        steps:
          - material: Cloth
            amount: 2
            doAfter: 3
  - node: pillowbaseunwrapped
    entity: PillowBaseUnwrapped
    edges:
# Base
      completed:
      - !type:SpawnPrototype
        prototype: PillowBaseWrapped
        amount: 1
      steps:
      - material: Plastic
        amount: 1

# Command
      - to: pillowcommandunwrapped
        steps:
        - material: FloorCarpetPurple
          amount: 1
        - material: Gold
          amount: 1
  - node: pillowcommandunwrapped
    entity: PillowCommandUnwrapped
    edges:
      completed:
      - !type:SpawnPrototype
        prototype: PillowCommandWrapped
        amount: 1
      steps:
      - material: Plastic
        amount: 1

# Engineering
      - to: pillowengineeringunwrapped
        steps:
        - material: FloorCarpetOrange
          amount: 1
  - node: pillowengineeringunwrapped
    entity: PillowEngineeringUnwrapped
    edges:
      completed:
      - !type:SpawnPrototype
        prototype: PillowEngineeringWrapped
        amount: 1
      steps:
      - material: Plastic
        amount: 1

# Medical
      - to: pillowmedicalunwrapped
        steps:
        - material: FloorCarpetSkyBlue
          amount: 1
  - node: pillowmedicalunwrapped
    entity: PillowMedicalUnwrapped
    edges:
      completed:
      - !type:SpawnPrototype
        prototype: PillowMedicalWrapped
        amount: 1
      steps:
      - material: Plastic
        amount: 1
