- type: entity
  id: LoadoutDummyStorybook
  categories: [ HideSpawnMenu ]
  name: random storybook
  description: A book you picked out to read to pass the time.
  components:
  - type: Sprite
    sprite: Objects/Misc/books.rsi
    state: book_icon

- type: entity
  id: LoadoutDummyWheelchair
  categories: [ HideSpawnMenu ]
  name: wheelchair
  description: A chair with big wheels. It looks like you can move in these on your own.
  components:
  - type: Sprite
    sprite: Objects/Vehicles/wheelchair.rsi
    layers:
    - state: wheelchair
      map: ["unfoldedLayer"]
    - state: wheelchair_folded
      map: ["foldedLayer"]
      visible: false

