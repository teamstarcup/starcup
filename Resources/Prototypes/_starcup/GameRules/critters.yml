# tables
# localized events spawn from a single event, otherwise they spawn across the station. pests should be widespread while dangerous ones should be localized

- type: entityTable
  id: CalmCritterEventsTable
  table: !type:AllSelector
    children:
    - id: SnailMigrationLowPop
    - id: CockroachMigration
    - id: MouseMigration
    - id: MothroachSpawn

- type: entityTable
  id: HostileCritterEventsTable
  table: !type:AllSelector
    children:
    - id: SlimesSpawnLocalized
    - id: SnakeSpawnLocalized
    - id: SpiderSpawnLocalized
    - id: SpiderClownSpawnLocalized

# pests

- type: entity
  id: MouseMigrationLocalized
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-vent-creatures-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    earliestStart: 15
    weight: 6
    duration: 30
  - type: VentCrittersRuleLocalized
    table: !type:GroupSelector
      children:
      - id: MobMouse
      - id: MobMouse1
      - id: MobMouse2

- type: entity
  id: CockroachMigrationLocalized
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-vent-creatures-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    weight: 6
    duration: 30
  - type: VentCrittersRuleLocalized
    table: !type:GroupSelector
      children:
      - id: MobCockroach
        weight: 0.9
      - id: MobMothroach
        weight: 0.1

- type: entity
  id: SnailMigrationLowPopLocalized
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-vent-creatures-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    weight: 6
    duration: 50
  - type: VentCrittersRuleLocalized
    table: !type:GroupSelector
      children:
      - id: MobSnail
        weight: 0.9
      - id: MobSnailSpeed
        weight: 0.05
      - id: MobSnailMoth
        weight: 0.05

- type: entity
  id: MothroachSpawn
  parent: BaseGameRule
  components:
  - type: StationEvent
    startAnnouncement: station-event-vent-creatures-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    earliestStart: 15
    minimumPlayers: 5 # starcup: 15 -> 5
    weight: 4
    duration: 50
  - type: VentCrittersRule
    entries:
    - id: MobMothroach
      prob: 0.02
    - id: MobMoproach
      prob: 0.0005

- type: entity
  id: FliesMigration
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-vent-creatures-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    weight: 6
    duration: 50
  - type: VentCrittersRule
    entries:
      - id: MobFlySwarm

# Hostiles
- type: entity
  id: XenoSpawnHorde
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-vent-creatures-start-horde-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    earliestStart: 45
    minimumPlayers: 15
    weight: 5
    duration: 15
    maxDuration: 30
  - type: VentHordeRule
    table: !type:AllSelector
      children:
      - !type:GroupSelector
        rolls: 4, 8
        children:
        - id: MobXeno
        - id: MobXenoDrone
        - id: MobXenoRunner
        - id: MobXenoSpitter
        - id: MobXenoRouny
          weight: 0.05
        - id: MobXenoRavager
          weight: 0.1
    passiveSound:
      path: /Audio/_DEN/VentCritters/vent_xeno.ogg
    endSound:
      collection: MetalBreak
    ventBreakChance: 1.0
    ventReplacement: GasVentPumpInfested

- type: entity
  id: MosquitoSpawnHorde
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-vent-creatures-start-horde-announcement
