    minimumPlayers: 15
    weight: 5
    duration: 15
    maxDuration: 30
  - type: VentHordeRule
    table: !type:AllSelector
      children:
      - !type:GroupSelector
        rolls: 6, 10
        children:
        - id: MobGiantMosquito
        - id: MobMosquitoSwarm
          weight: 0.3
    passiveSound:
      path: /Audio/_starcup/VentCritters/vent_mosquitoes.ogg
    endSound:
      collection: MetalBreak
    ventBreakChance: 0.5
    ventReplacement: GasVentPumpBroken

