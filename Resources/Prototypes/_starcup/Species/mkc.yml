- type: species
  id: MKC
  name: species-name-mkc
  roundStart: true
  prototype: MobMKC
  sprites: MobMKCSprites
  markingLimits: MobMKCMarkingLimits
  dollPrototype: AppearanceMKC
  skinColoration: Hues
  minAge: 1
  maxAge: 240
  oldAge: 50
  youngAge: 50
  maleFirstNames: IpcFirst
  femaleFirstNames: IpcFirst
  lastNames: IpcLast
  naming: FirstDashLast
  sexes:
  - Unsexed
  minHeight: 0.85
  maxHeight: 1.05

- type: speciesBaseSprites
  id: MobMKCSprites
  sprites:
    TailBehind: MobHumanoidAnyMarking
    TailOversuit: MobHumanoidAnyMarking
    HeadBase: MobHumanoidAnyMarking
    Head: MobMKCHead
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    Hair: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Chest: MobMKCTorso
    LArm: MobMKCLArm
    RArm: MobMKCRArm
    LHand: MobMKCLHand
    RHand: MobMKCRHand
    LLeg: MobMKCLLeg
    RLeg: MobMKCRLeg
    LFoot: MobMKCLFoot
    RFoot: MobMKCRFoot

- type: markingPoints
  id: MobMKCMarkingLimits
  points:
    Hair:
      points: 2
      required: false
    FacialHair:
      points: 1
      required: false
    HeadBase:
      points: 1
      required: true
      defaultMarkings: [ MobMKCHeadDefault ]
    Head:
      points: 1
      required: false
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Chest:
      points: 1
      required: true
      defaultMarkings: [ MobMKCTorsoDefault ]
    Legs:
      points: 4
      required: true
      defaultMarkings: [ MobMKCLLegDefault, MobMKCLFootDefault, MobMKCRLegDefault, MobMKCRFootDefault ]
    Arms:
      points: 4
      required: true
      defaultMarkings: [ MobMKCLArmDefault, MobMKCLHandDefault, MobMKCRArmDefault, MobMKCRHandDefault ]

- type: humanoidBaseSprite
  id: MobMKCMarkingFollowSkin
  markingsMatchSkin: true
  layerAlpha: 0.5

- type: humanoidBaseSprite
  id: MobMKCScreen

