- type: gameMap
  id: Ptarmigan
  mapName: 'Ptarmigan Outpost'
  mapPath: /Maps/_starcup/Events/ptarmigan.yml # TODO
  maxRandomOffset: 0
  randomRotation: false
  minPlayers: 0
  maxPlayers: 15
  stations:
    Ptarmigan:
      stationProto: StandardTerrestrialStationTrading
      components:
      - type: StationNameSetup
        mapNameTemplate: 'Ptarmigan Outpost'
        nameGenerator:
          !type:SyndicateNameGenerator
          prefixCreator: 'CAT'
      - type: StationEmergencyShuttle
        emergencyShuttlePath: /Maps/_starcup/Shuttles/ #TODO
      - type: StationBiome
        biome: Snow
        mapLightColor: "#2B3153"
      - type: StationJobs
        availableJobs: # 15 jobs total w/o latejoins, 19 jobs total w/ latejoins
          #command (2)
          Captain: [ 1, 1 ]
          HeadOfSecurity: [ 1, 1 ]
          #service (4)
          Bartender: [ 1, 1 ]
          Botanist: [ 1, 1 ]
          Chef: [ 1, 1 ]
          Janitor: [ 1, 1 ]
          #engineering (2 - 3)
          AtmosphericTechnician: [ 1, 1 ]
          StationEngineer: [ 1, 2 ]
          #medical (2 - 3)
          Chemist: [ 1, 1 ]
          MedicalDoctor: [ 1, 2 ]
          #science (1)
          Scientist: [ 1, 1 ]
          #security (1 - 3)
          SecurityOfficer: [ 1, 3 ]
          #supply (2)
          CargoTechnician: [ 1, 1 ]
          SalvageSpecialist: [ 1, 1 ]
          #civilian (1+)
          Passenger: [ -1, -1 ] #infinite, not counted
          Prisoner: [ 2, 2 ]
          Musician: [ 1, 1 ]
