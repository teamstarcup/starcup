# For general or interdepartmental notices
- type: entity
  parent: Paper
  id: PaperNoticeBoardMailTeleporters
  name: general notice - mail teleporter upgrade
  categories: [ HideSpawnMenu ]
  components:
  - type: Paper
    stampState: paper_stamp-syndicate
    stampedBy:
    - stampedColor: '#664400'
      stampedName: stamp-component-stamped-name-syndcomm
      stampLargeIcon: large_stamp-syndcomm
    content: |2
      [mono]█▀  [color=#AA0000]█▀▀[/color]  ▀█  [italic]Supplier Update[/italic]
      █   [color=#AA0000]▀▀█[/color]   █
      ▀▀  [color=#AA0000]▀▀▀[/color]  ▀▀  [mono]Mail Teleporter Upgrade[/mono]
      ─────────────────────────────────────────────
      [mono]Congratulations! Your workplace is now
      operating on the next version of our BlueBox
      mail teleporter technology. Enjoy a
      redesigned look, an expansive internal
      storage compartment, and most excitingly of
      all, an broader service network ensuring
      [bold]new and exciting deliveries![/bold]

      Be sure to inform all employees that our new
      all-recycled packaging is regrettably more
      vulnerable to puncturing than before. This
      means that [bold]mail can now be forcibly opened
      using any cutting tool.[/bold]

      Finally, note that until the interns have
      completed their training on the new units,
      [bold]tailored parcels from SyndComm will be
      unavailable.[/bold]
      [/mono]
      ─────────────────────────────────────────────
      Hawkmoon Outreach Division
      [/mono]
