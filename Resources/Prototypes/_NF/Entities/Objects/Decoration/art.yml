# region posters base
- type: entity
  abstract: true
  parent: BaseItem
  id: NFBasePoster
  name: poster
  description: A rolled up poster. You won't be sure what the design is until you put it up on the wall.
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/posters.rsi
    state: rolled_legit
  - type: Item
    sprite: _NF/Objects/Decoration/posters.rsi
  - type: NFWallmountable
    spawn: RandomPosterAny
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg
          params:
            volume: -4
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  abstract: true
  parent: NFBasePoster
  id: NFPosterRolledLegit
  description: A rolled up Syndicate-approved poster. # starcup
  suffix: Rolled # starcup: we capitalize suffixes
  components:
  # begin starcup: syndie swap
  - type: Sprite
    state: rolled_contraband
  # end starcup
  - type: StaticPrice
    price: 500

- type: entity
  abstract: true
  parent: [BaseMinorContraband, NFBasePoster] # starcup
  id: NFPosterRolledContraband
  description: A rolled up contraband poster.
  suffix: Rolled # starcup: we capitalize suffixes
  components:
  # begin starcup: syndie swap
  - type: Sprite
    state: rolled_legit
  # end starcup
  - type: StaticPrice
    price: 750

# region posters random
- type: entity
  parent: NFPosterRolledLegit
  id: NFPosterCorporate
  name: approved poster # starcup
  description: A rolled up Syndicate-approved poster. You won't be sure what the design is until you put it up on the wall. # starcup: syndie swap
  components:
  - type: NFWallmountable
    spawn: RandomPosterLegitSyndie # starcup

- type: entity
  parent: NFPosterRolledContraband
  id: NFPosterContraband
  name: contraband poster
  description: A rolled up contraband poster. You won't be sure what the design is until you put it up on the wall.
  components:
  - type: NFWallmountable
    spawn: RandomPosterContrabandSyndie # starcup

# region paintings base
- type: entity
  abstract: true
  parent: BaseItem
  id: NFBasePaintingCurtained
  name: painting
  description: A masterpiece hidden under cloth.
  components:
  - type: Sprite
    sprite: _NF/Objects/Decoration/paintings.rsi
    state: painting
  - type: MultiHandedItem
  - type: Item
    size: Ginormous
  - type: Damageable
    damageContainer: Inorganic
  - type: DamageExaminable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
  - type: MeleeWeapon
    attackRate: 0.5
    soundHit:
      collection: MetalThud
    damage:
      types:
        Blunt: 10
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 4
  - type: DamageOnHit
    damage:
      types:
        Blunt: 4
  - type: DamageOnLand
    damage:
      types:
        Blunt: 20
  - type: EmitSoundOnLand
    sound:
      collection: MetalThud
      params:
        variation: 0.25
  - type: StaticPrice
    price: 1000

# region random painting
- type: entity
  parent: NFBasePaintingCurtained
  id: NFPaintingCurtainedRandom
  name: painting
  suffix: Curtained # starcup
  description: A masterpiece hidden under cloth.  You aren't sure what the painting is until you put it up on the wall.
  components:
  - type: NFWallmountable
    spawn: RandomPainting

