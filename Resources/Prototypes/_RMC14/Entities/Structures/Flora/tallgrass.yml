- type: entity
  abstract: true
  parent: BaseStructure # starcup: Originally used a different, RMC-only prototype.
  id: RMCGrassTallBase
  name: tall grass # starcup: added a space
  suffix: centre # starcup: removed capitalization for style
  components:
  # begin starcup
  - type: FloorOccluder
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  # end starcup
  - type: Sprite
    sprite: _RMC14/Structures/Flora/tallgrass.rsi
    state: tallgrass
  - type: Physics
    bodyType: Static
  # begin starcup
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  # end starcup
  - type: Damageable
    damageContainer: Inorganic
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Weapons/slash.ogg"
        params:
          variation: 0.05
  - type: Destructible
    thresholds:
    - trigger:
        # begin starcup: make it slashable
        !type:DamageTypeTrigger
        damageType: Slash
        damage: 10
        # end starcup
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  abstract: true
  parent: RMCGrassTallBase
  id: RMCGrassTallSidesBase
  suffix: Sides
  components:
  - type: Sprite
    state: tallgrass_sides

- type: entity
  abstract: true
