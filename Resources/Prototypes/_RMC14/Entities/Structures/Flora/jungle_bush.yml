# These should really use sprite colour instead of being manually coloured but sprite fade breaks down with sprite colour on an entity so we manually colour instead.

- type: entity
  # begin starcup: Removed redundant RMC flora prototypes.
  parent: RMCBasePlant
  id: RMCBushJungle
  # end starcup
  components:
  - type: Sprite
  # begin starcup: Condensed individual entities into a single one with random sprites.
    sprite: _RMC14/Structures/Flora/bush.rsi
    layers:
    - state: bush1
      map: ["random"]
    offset: 0.1, 0.35
    drawdepth: Overdoors
  - type: RandomSprite
    available:
    - random:
        bush1: ""
        bush2: ""
        bush3: ""
  # end starcup
  - type: SpriteFade
