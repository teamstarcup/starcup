- type: entity
  parent: BaseTree # starcup: Removed redundant RMC flora prototypes.
  id: RMCBaseTreeAlien
  abstract: true
  name: strange tree
  description: Some kind of bizarre alien tree. It oozes with a sickly yellow sap.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Flora/flora_treealien.rsi
    offset: 0,0.7
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.3,0.1,0.3"
        density: 4000
        layer:
        - WallLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/tree_fell.ogg
          params:
            volume: 5
            variation: 0.05
      - !type:SpawnEntitiesBehavior
        spawn:
          RMCStump3:
            min: 1
            max: 1
        offset: 0
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: RMCBaseTreeAlien
  id: RMCAlienTree # starcup: Removed the 01 part, as we'll use randomized sprites.
  components:
  - type: Sprite
  # begin starcup: more variety
    layers:
    - state: treealien01
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        treealien01: ""
        treealien02: ""
        treealien03: ""
        treealien04: ""
        treealien05: ""
        treealien06: ""
  # end starcup
