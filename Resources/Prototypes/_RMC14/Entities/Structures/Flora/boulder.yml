# Relocated RMCBoulder from flora.yml to here.

- type: entity
  # begin starcup: Removed redundant RMC flora prototypes.
  parent: BaseRock
  id: RMCBoulder
  # end starcup
  name: boulder
  suffix: brown # starcup
  description: A large rock. It's not cooking anything.
  components:
  - type: Sprite
  # begin starcup: Condensed individual entities into a single one with random sprites.
    sprite: _RMC14/Objects/Flora/boulder.rsi
    layers:
    - state: boulder1
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        boulder1: ""
        boulder2: ""
        boulder3: ""
  # end starcup

- type: entity
  parent: BaseRock # starcup: Removed redundant RMC flora prototypes.
  id: RMCBoulderLarge
  name: boulder
  suffix: large, brown # starcup
  description: A large rock. It's not cooking anything.
  placement:
    mode: SnapgridBorder
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Flora/boulder_large.rsi
  # begin starcup: Condensed individual entities into a single one with random sprites.
    layers:
    - state: boulder_large1
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        boulder_large1: ""
        boulder_large2: ""
  # end starcup
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600 # starcup: make them more durable
      behaviors:
      # begin starcup: give it a sound
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/_starcup/Effects/rock_break.ogg
          params:
            volume: 5
            variation: 0.05
      # end starcup
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  # begin starcup: properly sized hitbox
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.8
        density: 1000
        layer:
        - HalfWallLayer
        - Opaque
  # end starcup

- type: entity
  parent: RMCBoulderLarge
  id: RMCBoulderWide
  suffix: wide, brown
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Flora/boulder_wide.rsi
  # begin starcup: correcting the sprite in absence of original parent prototype. I guess they weren't that redundant after all.
    layers:
    - state: boulder1
  # end starcup
  # begin starcup: correcting shape
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.3,0.5,0.3"
        density: 1000
        layer:
        - HalfWallLayer
        - Opaque
  # end starcup
