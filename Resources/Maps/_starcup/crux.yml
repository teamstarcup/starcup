  entities:
  - uid: 1758
    components:
    - type: MetaData
      name: Situation Report
    - type: Transform
      parent: 1756
    - type: Paper
      content: >2-
           ⠀[color=#1b487e]███░███░░░░██░░░░[/color]
           ⠀[color=#1b487e]░██░████░░░██░░░░[/color]          [head=3]NanoTrasen[/head]
           ⠀[color=#1b487e]░░█░██░██░░██░█░░[/color]
           ⠀[color=#1b487e]░░░░██░░██░██░██░[/color]         [bold]Station NT-320[/bold]
           ⠀[color=#1b487e]░░░░██░░░████░███[/color]             [bold]"Bullseye"[/bold]
        ====================================================
                                        SITUATION REPORT
        ====================================================


        This is Captain Calls-the-Flock. The project has failed.


        I'm writing in the hopes that it will make what CentComm will find here easier to understand. The invaders have abducted nearly everyone on the station now, and if they're able to rip holes into reality, I don't imagine some blast doors will hold them back for very long.


        Research Director Blythe hasn't had the time to write a report, and even though we're the only ones left, I don't think she's in a mental state to do so anyways. All she's been able to tell me is that there were [italic]people[/italic] coming out of those glowing pods we were trying to cultivate. People made of flesh and blood and flowers. And that after emerging they thanked her for "the chance to finally arrive." This was, presumably, right before they started kidnapping people and summoning anomalous creatures to blast us with lasers.


        CentComm generally disapproves of station-wide fumigation as a problem-solving tool. But CentComm isn't fucking answering me, and I'd like to see these treehuggers handle a plasma fire.


        We'll just have to see how fireproof these lockers are. I guess if you're reading this, you'll know.
